<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRFT Rotation</title>
<script>
  window._wasmCacheBust = Date.now();
  (function() {
    const sp = new URLSearchParams(location.search);
    const w = sp.get('w'), h = sp.get('h');
    const s = document.documentElement.style;
    if (w) s.width  = Math.max(200, +w) + 'px';
    if (h) s.height = Math.max(200, +h) + 'px';
    const wave = sp.get('wave');
    if (['sine','triangle','sawtooth','square','sweep'].includes(wave)) window._initWave = wave;
    const freq = parseFloat(sp.get('freq'));
    if (!isNaN(freq) && freq > 0) window._initFreq = freq;
    const disp = sp.get('disp');
    if (disp === 'wave' || disp === 'scope') window._initDisp = disp;
    const dalphaStr = sp.get('dalpha');
    if (dalphaStr) {
      const v = parseFloat(dalphaStr);
      if (!isNaN(v) && v > 0) window._initDalpha = v;
    }
    if (sp.get('interactive') === '0') window._initInteractive = false;
    const win = sp.get('win');
    if (win === 'hann' || win === 'rect') window._initWin = win;
  })();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, select { font: inherit; }

:root {
  --bg:        #1a1a1a;
  --surface:   #1e1e1e;
  --border:    #333333;
  --border2:   #3a3a3a;
  --accent:    #c8902a;
  --accent-lo: #7a5418;
  --text:      #d0d0d0;
  --muted:     #888888;
  --red:       #cc4444;
}

html { font-size: 12px; }
html, body {
  width: 100%; height: 100%;
  background: transparent;
  color: var(--text);
  font-family: "Inter", "Segoe UI", -apple-system, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

#topBar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0.5em;
  padding: 0.25em 0.6em;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 2.4em;
}
#topBar label { font-size: 0.78em; color: var(--muted); white-space: nowrap; }
#topBar select, #topBar input[type="number"] {
  height: 1.8em;
  background: var(--bg); border: 1px solid var(--border2); border-radius: 3px;
  color: var(--text); padding: 0 0.4em; font-size: 0.82em; outline: none; cursor: pointer;
}
#topBar select:focus, #topBar input:focus { border-color: var(--accent); }
#freqNum { width: 4.5em; -moz-appearance: textfield; }
#freqNum::-webkit-inner-spin-button,
#freqNum::-webkit-outer-spin-button { -webkit-appearance: none; }

#status {
  flex: 1; font-size: 0.78em; color: var(--muted);
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
#status.err { color: var(--red); }

#infoBtn {
  height: 1.8em; padding: 0 0.55em;
  background: var(--surface); color: var(--muted);
  border: 1px solid var(--border2); border-radius: 3px;
  font-size: 0.9em; font-weight: 700; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center;
}
#infoBtn:hover { color: var(--text); }

#main {
  flex: 1; position: relative; overflow: hidden; background: var(--bg);
}

#bgCanvas { position: absolute; inset: 0; pointer-events: none; }

/* ── Panels ──────────────────────────────────────────────── */
.panel {
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: border-color 0.1s;
}
.panel:hover  { border-color: rgba(200,144,42,0.55); }
.panel.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-lo), 0 1px 5px rgba(0,0,0,0.5); }

.pcv { flex: 1; width: 100%; min-height: 0; display: block; image-rendering: auto; }

.panel.computing { cursor: wait; }
button:hover:not(:disabled) { filter: brightness(1.15); }
button:active:not(:disabled) { filter: brightness(0.85); }

.panel-label {
  position: absolute; pointer-events: none;
  font-size: 0.70em; font-weight: 500; white-space: nowrap;
  color: rgba(200,200,200,0.70);
  transform: translateX(-50%);
}

.tab-group { display: flex; flex-shrink: 0; height: 1.8em; }
.tab {
  padding: 0 0.7em; height: 100%;
  background: var(--surface2,var(--surface)); color: var(--muted);
  border: 1px solid var(--border2,var(--border)); border-radius: 0;
  font-size: 0.80em; font-weight: 600; cursor: pointer;
}
.tab:first-child { border-radius: 3px 0 0 3px; }
.tab:last-child  { border-radius: 0 3px 3px 0; }
.tab.active { background: var(--accent-lo); color: var(--accent); border-color: var(--accent); }

/* ── Params bar (static mode) ────────────────────────────── */
#paramsBar {
  flex-shrink: 0;
  display: none;
  align-items: center;
  gap: 0.6em;
  flex-wrap: wrap;
  padding: 0.3em 0.8em;
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.st-item { display:flex; align-items:baseline; gap:0.25em; white-space:nowrap; }
.st-key  { font-size:0.68em; font-weight:700; letter-spacing:0.05em; color:var(--muted); }
.st-val  { font-size:0.78em; font-weight:700; color:var(--text); }
.st-val.accent { color:var(--accent); }
.st-sep  { color:var(--border2); font-size:0.7em; user-select:none; }
</style>
</head>
<body>
<div id="topBar">
  <span id="recomputeControls" style="display:contents">
  <label>Wave</label>
  <select id="waveSel">
    <option value="sine" selected>Sine</option>
    <option value="triangle">Triangle</option>
    <option value="sawtooth">Sawtooth</option>
    <option value="square">Square</option>
    <option value="sweep">Freq sweep</option>
  </select>
  <label>Freq</label>
  <input id="freqNum" type="number" value="440" min="20" max="20000" step="10">
  <label>Hz</label>
  <label style="margin-left:0.4em">Win</label>
  <select id="winSel">
    <option value="hann" selected>Hann</option>
    <option value="rect">Rectangular</option>
  </select>
  </span>
  <div class="tab-group" style="margin-left:0.4em">
    <button class="tab active" id="tabWave">Waveform</button>
    <button class="tab" id="tabSpec">Spectrogram</button>
  </div>
  <span id="status">Loading…</span>
  <button id="infoBtn" title="More info &amp; embed instructions">&lt;/&gt;</button>
</div>
<div id="main">
  <canvas id="bgCanvas"></canvas>
</div>
<div id="paramsBar"></div>
<script>
'use strict';

// ── Constants ────────────────────────────────────────────────────────────────
const DELTA_ALPHA = (window._initDalpha != null) ? window._initDalpha : (1 / 3);
const NUM_ALPHA   = Math.round(4 / DELTA_ALPHA);
// Use i*4/NUM_ALPHA instead of i*DELTA_ALPHA to avoid floating-point drift
// (e.g. 3*(1/3) = 0.9999... vs 3*4/12 = 1.0 exactly)
const ALPHA_LIST  = Array.from({length: NUM_ALPHA}, (_, i) => i * 4 / NUM_ALPHA);
const CARD_IDX    = ALPHA_LIST.reduce((arr, a, i) => {
  if (Number.isInteger(a) && a <= 3) arr.push(i);
  return arr;
}, []);
const N_SAMPLES  = 131072;  // 2^17 samples (~2.97 s at 44100 Hz)
// Layout fractions (of min(mainW, mainH))
const CIR_R_F    = 0.155;  // circle radius
const PANEL_D    = 0.400;  // single-ring radius for all panel centers
const PANEL_W_F  = 0.185;  // panel width  (landscape: x-sep binds at −60°/−90°)
const PANEL_H_F  = 0.140;  // panel height (y-sep binds at −30°/−60°)

function alphaFrac(idx) {
  // idx * 4 / NUM_ALPHA in lowest terms; integer multiples → whole number label
  const d = NUM_ALPHA / 4;           // denominator (e.g. 3 for delta=1/3)
  const n = idx;                     // numerator before simplification
  if (n % d === 0) return String(n / d);
  return n + '/' + d;
}

// ── State ────────────────────────────────────────────────────────────────────
let sampleRate       = 44100;
let dryBuf           = null;
let windowedBuf      = null;
let wetBufs          = new Array(NUM_ALPHA).fill(null);
let specCache        = new Map();
let computeDone      = false;
let playStartCtxTime = 0;
let playDuration     = 0;
let playheadRaf      = 0;
let arrowAlpha  = -1;
let activeIdx   = -1;
let audioCtx    = null;
let activeSrc   = null;

let frftWorker  = null;
let workerReady = false;
let queuePid    = 0;
let queuePos    = 0;

// ── DOM ───────────────────────────────────────────────────────────────────────
const mainEl      = document.getElementById('main');
const bgCanvas    = document.getElementById('bgCanvas');
const waveSel     = document.getElementById('waveSel');
const freqNum     = document.getElementById('freqNum');
const winSel      = document.getElementById('winSel');
const tabWave     = document.getElementById('tabWave');
const tabSpec     = document.getElementById('tabSpec');
const statusEl    = document.getElementById('status');
const infoBtn     = document.getElementById('infoBtn');

let activeView = 'wave';
function setView(v) {
  activeView = v;
  tabWave.classList.toggle('active', v === 'wave');
  tabSpec.classList.toggle('active', v === 'scope');
  panels.forEach((_, i) => renderPanel(i));
}

if (window._initWave) waveSel.value = window._initWave;
if (window._initFreq) freqNum.value = String(window._initFreq);
if (window._initDisp) activeView = window._initDisp;
if (window._initWin)  winSel.value = window._initWin;
freqNum.disabled = waveSel.value === 'sweep';

const INTERACTIVE = window._initInteractive !== false;
if (!INTERACTIVE) {
  document.getElementById('recomputeControls').style.display = 'none';

  const pb = document.getElementById('paramsBar');
  pb.style.display = 'flex';
  const wave = waveSel.value;
  const freq = parseFloat(freqNum.value);
  const win  = winSel.value === 'hann' ? 'Hann' : 'Rectangular';
  const items = [
    { key: 'Wave',   val: wave.charAt(0).toUpperCase() + wave.slice(1) },
    ...(wave !== 'sweep' ? [{ key: 'Freq', val: freq + ' Hz', accent: true }] : []),
    { key: 'Window', val: win },
  ];
  items.forEach((item, i) => {
    if (i > 0) { const s = document.createElement('span'); s.className = 'st-sep'; s.textContent = '·'; pb.appendChild(s); }
    const el = document.createElement('span');
    el.className = 'st-item';
    el.innerHTML = `<span class="st-key">${item.key}</span><span class="st-val${item.accent ? ' accent' : ''}">${item.val}</span>`;
    pb.appendChild(el);
  });
}

// ── Create panels ─────────────────────────────────────────────────────────────
const panels = ALPHA_LIST.map((alpha, idx) => {
  const isCard  = CARD_IDX.includes(idx);
  // cardPos: 0=Time Signal, 1=FFT, 2=Time Reversed, 3=Inverse FFT
  const cardPos = isCard ? Math.round(alpha) : -1;

  const div = document.createElement('div');
  div.className = 'panel computing';
  div.addEventListener('click', () => togglePlay(idx));

  const cv = document.createElement('canvas');
  cv.className = 'pcv';

  div.append(cv);
  mainEl.appendChild(div);

  const CARD_LABELS = ['Time Signal', 'FFT', 'Time Reversed', 'Inverse FFT'];
  let labelEl = null;
  if (isCard) {
    labelEl = document.createElement('span');
    labelEl.className = 'panel-label';
    labelEl.textContent = CARD_LABELS[cardPos];
    mainEl.appendChild(labelEl);
  }

  return { div, cv, alpha, isCard, cardPos, labelEl };
});

// Sync tab state now that panels exist
tabWave.classList.toggle('active', activeView === 'wave');
tabSpec.classList.toggle('active', activeView === 'scope');

// ── Layout ────────────────────────────────────────────────────────────────────
// For delta=2, panels are only on the horizontal axis — use width as size
// so panel dimensions stay consistent regardless of the (shorter) height.
function layoutSize(mW, mH) {
  return DELTA_ALPHA >= 2 ? mW : Math.min(mW, mH);
}

function panelPos(mW, mH, alpha, idx) {
  const angle = -Math.PI / 2 * alpha;
  const size  = layoutSize(mW, mH);
  const D  = PANEL_D * size;
  const pw = PANEL_W_F * size;
  const ph = PANEL_H_F * size;
  const cx = mW / 2 + D * Math.cos(angle);
  const cy = mH / 2 + D * Math.sin(angle);
  return { left: cx - pw / 2, top: cy - ph / 2, width: pw, height: ph };
}

function layoutAll() {
  const mW = mainEl.clientWidth, mH = mainEl.clientHeight;
  if (mW < 10 || mH < 10) return;
  const dpr = window.devicePixelRatio || 1;

  bgCanvas.width  = Math.round(mW * dpr);
  bgCanvas.height = Math.round(mH * dpr);
  bgCanvas.style.width  = mW + 'px';
  bgCanvas.style.height = mH + 'px';

  panels.forEach(({ div, cv, alpha, cardPos, labelEl }, idx) => {
    const p = panelPos(mW, mH, alpha, idx);
    Object.assign(div.style, {
      left:   Math.round(p.left)   + 'px',
      top:    Math.round(p.top)    + 'px',
      width:  Math.round(p.width)  + 'px',
      height: Math.round(p.height) + 'px',
    });
    cv.width  = Math.round(p.width * dpr);
    cv.height = Math.round(p.height * dpr);
    renderPanel(idx);

    if (labelEl) {
      const GAP = 5;
      const cx  = Math.round(p.left + p.width / 2);
      // cardPos 1 = FFT (top panel) → label above; all others → label below
      if (cardPos === 1) {
        labelEl.style.left = cx + 'px';
        labelEl.style.top  = Math.round(p.top - GAP) + 'px';
        labelEl.style.transform = 'translateX(-50%) translateY(-100%)';
      } else {
        labelEl.style.left = cx + 'px';
        labelEl.style.top  = Math.round(p.top + p.height + GAP) + 'px';
        labelEl.style.transform = 'translateX(-50%)';
      }
    }
  });

  drawBg();
}

new ResizeObserver(layoutAll).observe(mainEl);

// ── Background canvas ─────────────────────────────────────────────────────────
function drawBg() {
  const mW = mainEl.clientWidth, mH = mainEl.clientHeight;
  if (mW < 10 || mH < 10) return;
  const dpr = window.devicePixelRatio || 1;
  const ctx = bgCanvas.getContext('2d');
  ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  ctx.save();
  ctx.scale(dpr, dpr);

  const size = layoutSize(mW, mH);
  const cx = mW / 2, cy = mH / 2;
  const R  = CIR_R_F * size;

  // Connector lines
  panels.forEach(({ alpha }, idx) => {
    const p     = panelPos(mW, mH, alpha, idx);
    const angle = -Math.PI / 2 * alpha;
    const pcx   = p.left + p.width  / 2;
    const pcy   = p.top  + p.height / 2;
    const rx    = cx + R * Math.cos(angle);
    const ry    = cy + R * Math.sin(angle);
    const isActive = idx === activeIdx;
    ctx.strokeStyle = isActive ? 'rgba(200,144,42,0.85)' : 'rgba(130,130,130,0.70)';
    ctx.lineWidth   = isActive ? 1.8 : 0.9;
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(pcx, pcy); ctx.stroke();
  });

  // Main circle
  ctx.strokeStyle = '#606060';
  ctx.lineWidth   = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();

  // Tick marks + alpha labels on circle edge
  const lblFont = Math.max(10, R * 0.11);
  ctx.textBaseline = 'middle';

  ALPHA_LIST.forEach((alpha, idx) => {
    const angle  = -Math.PI / 2 * alpha;
    const isCard = CARD_IDX.includes(idx);
    const isActive = idx === activeIdx;

    // Tick
    const inner = R - (isCard ? 7 : 4);
    const outer = R + (isCard ? 7 : 4);
    ctx.strokeStyle = isActive ? 'rgba(200,144,42,0.95)'
                    : isCard   ? '#888888'
                    :            '#5a5a5a';
    ctx.lineWidth = isCard ? 1.5 : 0.9;
    ctx.beginPath();
    ctx.moveTo(cx + inner * Math.cos(angle), cy + inner * Math.sin(angle));
    ctx.lineTo(cx + outer * Math.cos(angle), cy + outer * Math.sin(angle));
    ctx.stroke();

    // Alpha value label inside ring
    const lblR = R * 0.865;
    const lx   = cx + lblR * Math.cos(angle);
    const ly   = cy + lblR * Math.sin(angle);
    const txt  = alphaFrac(idx);
    ctx.fillStyle = isActive ? '#c8902a'
                  : isCard   ? 'rgba(210,210,210,0.95)'
                  :            'rgba(140,140,140,0.90)';
    ctx.font      = isCard
      ? `700 ${lblFont * 1.1}px -apple-system, sans-serif`
      : `${lblFont}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(txt, lx, ly);
  });

  ctx.restore();
}

// ── Signal generation ─────────────────────────────────────────────────────────
function generateSignal(freq, n, sr, wave) {
  const buf = new Float32Array(n);
  if (wave === 'triangle') {
    for (let i = 0; i < n; i++)
      buf[i] = (2 / Math.PI) * Math.asin(Math.sin(2 * Math.PI * freq * i / sr));
  } else if (wave === 'sawtooth') {
    for (let i = 0; i < n; i++)
      buf[i] = 2 * ((freq * i / sr) % 1) - 1;
  } else if (wave === 'square') {
    for (let i = 0; i < n; i++)
      buf[i] = Math.sin(2 * Math.PI * freq * i / sr) >= 0 ? 1 : -1;
  } else if (wave === 'sweep') {
    const f0 = 20, f1 = Math.min(sr / 2 - 100, 20000);
    for (let i = 0; i < n; i++)
      buf[i] = Math.sin(2 * Math.PI * (f0 * i + (f1 - f0) * i * i / (2 * n)) / sr);
  } else {
    for (let i = 0; i < n; i++)
      buf[i] = Math.sin(2 * Math.PI * freq * i / sr);
  }
  return buf;
}

// ── Analysis window ───────────────────────────────────────────────────────────
function applyWindow(buf, type) {
  const N   = buf.length;
  const out = new Float32Array(N);
  if (type === 'hann') {
    for (let i = 0; i < N; i++)
      out[i] = buf[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
  } else {
    out.set(buf); // rectangular — no tapering
  }
  return out;
}

// ── Precompute ────────────────────────────────────────────────────────────────
function startPrecompute() {
  if (!workerReady) return;
  stopPlayback();
  computeDone = false;
  wetBufs.fill(null);
  specCache.clear();
  panels.forEach((_, i) => { panels[i].div.classList.add('computing'); renderPanel(i); });

  const freq = Math.max(20, Math.min(20000, parseFloat(freqNum.value) || 440));
  dryBuf     = generateSignal(freq, N_SAMPLES, sampleRate, waveSel.value);
  windowedBuf = applyWindow(dryBuf, winSel.value);

  queuePid++;
  queuePos = 0;
  setStatus('Computing…');
  sendNextJob();
}

function sendNextJob() {
  if (queuePos >= NUM_ALPHA) return;
  frftWorker.postMessage({
    type: 'process', samples: windowedBuf, alpha: ALPHA_LIST[queuePos],
    bufSize: N_SAMPLES, overlapFactor: 1, halfSpectrum: false,
    noWindow: true,  // analysis window already applied on main thread; no synthesis window
    jobId: queuePid * 100 + queuePos,
  });
  queuePos++;
}

function handleResult(jobId, output) {
  const pid = Math.floor(jobId / 100);
  if (pid !== queuePid) return;
  const idx = jobId % 100;
  wetBufs[idx] = output;
  setStatus(`Computing… ${idx + 1}/${NUM_ALPHA}`);
  renderPanel(idx);
  if (idx + 1 < NUM_ALPHA) {
    sendNextJob();
  } else {
    computeDone = true;
    setStatus('');
    panels.forEach(p => { p.div.classList.remove('computing'); });
    drawBg();
  }
}

// ── Panel rendering ───────────────────────────────────────────────────────────
function renderPanel(idx) {
  const { cv } = panels[idx];
  const W = cv.width, H = cv.height;
  if (W < 2 || H < 2) return;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0c0c0c';
  ctx.fillRect(0, 0, W, H);
  const buf = wetBufs[idx];
  if (!buf) return;
  if (activeView === 'scope') {
    // FFT (cardPos=1) and IFFT (cardPos=3) have sparse impulse-train content;
    // use a narrower dB window so harmonic amplitudes spread across more colours.
    const cp = panels[idx].cardPos;
    const dbRange = (cp === 1 || cp === 3) ? 40 : 60;
    renderSpectrogram(ctx, buf, W, H, panels[idx].isCard, dbRange);
  } else {
    const cp = panels[idx].cardPos;
    if ((cp === 1 || cp === 3) && isSparse(buf)) renderSpikeWaveform(ctx, buf, W, H);
    else                                          renderWaveform(ctx, buf, W, H);
  }
  // Playhead
  if (idx === activeIdx && audioCtx) {
    const frac = Math.min(1, (audioCtx.currentTime - playStartCtxTime) / playDuration);
    const px = Math.round(frac * W);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth   = 1.5;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
  }
}

function renderWaveform(ctx, buf, W, H) {
  const n = buf.length;
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < n; i++) { if (buf[i] < mn) mn = buf[i]; if (buf[i] > mx) mx = buf[i]; }
  const range = mx - mn;
  if (range < 1e-10) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth   = 0.5;
  const midY = (1 - (0 - mn) / range) * H;
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();
  ctx.strokeStyle = '#c8902a';
  ctx.lineWidth   = Math.max(0.7, W / 500);
  ctx.beginPath();
  for (let x = 0; x < W; x++) {
    const val = buf[Math.floor(x / W * n)];
    const y   = (1 - (val - mn) / range) * H;
    if (x === 0) ctx.moveTo(0.5, y); else ctx.lineTo(x + 0.5, y);
  }
  ctx.stroke();
}

// Returns true when >85 % of samples are within 5 % of the peak —
// i.e. the buffer is a sparse impulse train rather than a continuous signal.
function isSparse(buf) {
  const n = buf.length;
  let peak = 0;
  for (let i = 0; i < n; i++) { const a = Math.abs(buf[i]); if (a > peak) peak = a; }
  if (peak < 1e-10) return false;
  const thr = peak * 0.05;
  let zeros = 0;
  for (let i = 0; i < n; i++) { if (Math.abs(buf[i]) < thr) zeros++; }
  return zeros / n > 0.85;
}

// Stem / envelope renderer for sparse spike signals (FFT / IFFT panels).
// For each output pixel, takes the max absolute value across all samples
// that map to that pixel, then draws a symmetric vertical bar from the
// centre — so no spike can be missed by point-sampling.
function renderSpikeWaveform(ctx, buf, W, H) {
  const n = buf.length;

  // Find global peak for normalisation
  let peak = 0;
  for (let i = 0; i < n; i++) { const a = Math.abs(buf[i]); if (a > peak) peak = a; }
  if (peak < 1e-10) return;

  // Midline
  const midY = H / 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth   = 0.5;
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();

  // Per-pixel max-abs envelope → stems
  ctx.strokeStyle = '#c8902a';
  ctx.lineWidth   = Math.max(1, W / 400);
  ctx.beginPath();
  for (let x = 0; x < W; x++) {
    const i0 = Math.floor(x / W * n);
    const i1 = Math.min(n - 1, Math.floor((x + 1) / W * n));
    let maxAbs = 0;
    for (let i = i0; i <= i1; i++) {
      const a = Math.abs(buf[i]);
      if (a > maxAbs) maxAbs = a;
    }
    if (maxAbs < 1e-10) continue;
    const halfLen = (maxAbs / peak) * midY;
    ctx.moveTo(x + 0.5, midY - halfLen);
    ctx.lineTo(x + 0.5, midY + halfLen);
  }
  ctx.stroke();
}

function renderSpectrogram(ctx, buf, W, H, dynamic = false, dbRange = 60) {
  const stft = computeSTFT(buf);
  if (!stft) return;
  const { magDB, numFrames, NUM_BINS, dBmax, topBin } = stft;
  // For narrow-range panels (FFT/IFFT) anchor to actual peak so sparse
  // impulse-train content isn't pushed below the render floor.
  // For wide-range panels keep the −20 dB floor so noise-only buffers stay dark.
  const renderMax = dbRange < 60 ? dBmax : Math.max(dBmax, -20);
  const renderMin = renderMax - dbRange;
  const maxBin = dynamic ? topBin : NUM_BINS - 1;
  const img = ctx.createImageData(W, H);
  const px4 = img.data;
  for (let y = 0; y < H; y++) {
    const kf = (1 - (y + 0.5) / H) * maxBin;
    const k0 = Math.max(0, Math.floor(kf));
    const k1 = Math.min(NUM_BINS - 1, k0 + 1);
    const ky = kf - k0;
    for (let x = 0; x < W; x++) {
      const ff = (x + 0.5) / W * (numFrames - 1);
      const f0 = Math.max(0, Math.floor(ff));
      const f1 = Math.min(numFrames - 1, f0 + 1);
      const fx = ff - f0;
      const db = (magDB[f0 * NUM_BINS + k0] * (1-fx) + magDB[f1 * NUM_BINS + k0] * fx) * (1-ky)
               + (magDB[f0 * NUM_BINS + k1] * (1-fx) + magDB[f1 * NUM_BINS + k1] * fx) * ky;
      const t  = Math.max(0, Math.min(1, (db - renderMin) / (renderMax - renderMin)));
      const [r, g, b] = spectrogramColor(t);
      const i4 = (y * W + x) * 4;
      px4[i4]=r; px4[i4+1]=g; px4[i4+2]=b; px4[i4+3]=255;
    }
  }
  ctx.putImageData(img, 0, 0);

  if (dynamic && maxBin > 0) {
    const freqHz = maxBin / NUM_BINS * (sampleRate / 2);
    const label  = freqHz >= 1000
      ? (freqHz / 1000).toFixed(freqHz >= 10000 ? 0 : 1) + ' kHz'
      : Math.round(freqHz) + ' Hz';
    ctx.font      = `${Math.max(9, Math.round(W * 0.09))}px sans-serif`;
    ctx.textAlign = 'right';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(W - tw - 7, 2, tw + 6, parseInt(ctx.font) + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(label, W - 4, parseInt(ctx.font) + 2);
  }
}

// ── STFT (cached by buffer reference) ────────────────────────────────────────
function computeSTFT(samples) {
  if (!samples) return null;
  if (!computeSTFT._cache) computeSTFT._cache = new WeakMap();
  const cached = computeSTFT._cache.get(samples);
  if (cached) return cached;

  const FFT_SIZE  = 2048;
  const HOP       = 256;              // 8× overlap for smooth time axis
  const NUM_BINS  = FFT_SIZE >> 1;
  const numFrames = Math.max(1, Math.floor((samples.length - FFT_SIZE) / HOP) + 1);

  // Spectrogram always uses Hann window for analysis
  const win = new Float32Array(FFT_SIZE);
  for (let i = 0; i < FFT_SIZE; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (FFT_SIZE - 1));

  const magDB = new Float32Array(numFrames * NUM_BINS);
  const re = new Float64Array(FFT_SIZE), im = new Float64Array(FFT_SIZE);
  let dBmax = -Infinity;

  for (let f = 0; f < numFrames; f++) {
    const off = f * HOP;
    for (let i = 0; i < FFT_SIZE; i++) {
      re[i] = (off + i < samples.length ? samples[off + i] : 0) * win[i]; im[i] = 0;
    }
    fftInPlace(re, im, FFT_SIZE);
    for (let k = 0; k < NUM_BINS; k++) {
      const db = 20 * Math.log10(Math.sqrt(re[k]*re[k] + im[k]*im[k]) / FFT_SIZE + 1e-10);
      magDB[f * NUM_BINS + k] = db;
      if (db > dBmax) dBmax = db;
    }
  }

  // Fixed-range normalization: peak down 60 dB.
  // Floor renderMax so noise-only signals (e.g. discarded imaginary FT)
  // render as black rather than solid yellow.
  const renderMax = Math.max(dBmax, -20);
  const renderMin = renderMax - 60;

  // Top significant frequency bin
  const thr = dBmax - 55;
  let topBin = 5;
  for (let f = 0; f < numFrames; f++)
    for (let k = NUM_BINS - 1; k > topBin; k--)
      if (magDB[f * NUM_BINS + k] >= thr) { topBin = k; break; }
  topBin = Math.min(topBin + 8, NUM_BINS - 1);

  const result = { magDB, numFrames, NUM_BINS, dBmax, renderMin, renderMax, topBin };
  computeSTFT._cache.set(samples, result);
  return result;
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function togglePlay(idx) {
  if (activeIdx === idx) stopPlayback(); else startPlay(idx);
}

function startPlay(idx) {
  stopPlayback();
  const buf = wetBufs[idx];
  if (!buf) return;
  audioCtx  = new AudioContext({ sampleRate });
  const gain = audioCtx.createGain(); gain.gain.value = 0.5;
  gain.connect(audioCtx.destination);
  const ab = audioCtx.createBuffer(1, buf.length, sampleRate);
  ab.copyToChannel(buf, 0);
  activeSrc = audioCtx.createBufferSource();
  activeSrc.buffer = ab;
  activeSrc.connect(gain);
  activeSrc.onended = () => stopPlayback();
  activeSrc.start();
  playStartCtxTime = audioCtx.currentTime;
  playDuration     = buf.length / sampleRate;
  activeIdx  = idx;
  arrowAlpha = ALPHA_LIST[idx];
  panels[idx].div.classList.add('active');
  drawBg();
  startPlayheadLoop();
}

function stopPlayback() {
  cancelAnimationFrame(playheadRaf);
  if (activeSrc) { try { activeSrc.stop(); } catch {} activeSrc = null; }
  if (audioCtx)  { audioCtx.close(); audioCtx = null; }
  if (activeIdx >= 0) {
    panels[activeIdx].div.classList.remove('active');
    renderPanel(activeIdx);
  }
  activeIdx  = -1;
  arrowAlpha = -1;
  drawBg();
}

function startPlayheadLoop() {
  cancelAnimationFrame(playheadRaf);
  function tick() {
    if (activeIdx < 0) return;
    renderPanel(activeIdx);
    playheadRaf = requestAnimationFrame(tick);
  }
  playheadRaf = requestAnimationFrame(tick);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(text, cls = '') {
  statusEl.textContent = text;
  statusEl.className   = cls;
}

// ── Event listeners ───────────────────────────────────────────────────────────
waveSel.addEventListener('change', () => {
  freqNum.disabled = waveSel.value === 'sweep';
  stopPlayback(); startPrecompute();
});
freqNum.addEventListener('change', () => { stopPlayback(); startPrecompute(); });
freqNum.addEventListener('input',  () => {
  clearTimeout(freqNum._t);
  freqNum._t = setTimeout(() => { stopPlayback(); startPrecompute(); }, 500);
});
winSel.addEventListener('change', () => { stopPlayback(); startPrecompute(); });
tabWave.addEventListener('click', () => setView('wave'));
tabSpec.addEventListener('click', () => setView('scope'));
infoBtn.addEventListener('click', () => {
  window.open('https://behzadhaki.com/works/frft-in-the-browser/#frft-rotation-diagram', '_blank');
});

// ── FFT ───────────────────────────────────────────────────────────────────────
function fftInPlace(re, im, N) {
  let j = 0;
  for (let i = 1; i < N; i++) {
    let bit = N >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i]=re[j]; re[j]=t;
          t = im[i]; im[i]=im[j]; im[j]=t;
    }
  }
  for (let len = 2; len <= N; len <<= 1) {
    const half = len >> 1;
    const ang  = -2 * Math.PI / len;
    const wcos = Math.cos(ang), wsin = Math.sin(ang);
    for (let i = 0; i < N; i += len) {
      let wr = 1, wi = 0;
      for (let k = 0; k < half; k++) {
        const tr = wr*re[i+k+half] - wi*im[i+k+half];
        const ti = wr*im[i+k+half] + wi*re[i+k+half];
        re[i+k+half] = re[i+k]-tr; im[i+k+half] = im[i+k]-ti;
        re[i+k] += tr;             im[i+k] += ti;
        const nwr = wr*wcos - wi*wsin;
        wi = wr*wsin + wi*wcos; wr = nwr;
      }
    }
  }
}

// ── Colormap ──────────────────────────────────────────────────────────────────
const CMAP = [[5,5,25],[100,0,150],[200,50,100],[255,140,20],[255,255,100]];
function spectrogramColor(t) {
  const s  = t * (CMAP.length - 1);
  const lo = Math.floor(s);
  const hi = Math.min(lo + 1, CMAP.length - 1);
  const f  = s - lo;
  return [
    Math.round(CMAP[lo][0] + f*(CMAP[hi][0]-CMAP[lo][0])),
    Math.round(CMAP[lo][1] + f*(CMAP[hi][1]-CMAP[lo][1])),
    Math.round(CMAP[lo][2] + f*(CMAP[hi][2]-CMAP[lo][2])),
  ];
}

// ── Worker ────────────────────────────────────────────────────────────────────
function initWorker() {
  const cb       = window._wasmCacheBust;
  const jsUrl    = new URL('../wasm/dist/frft.js',    location.href).href + '?v=' + cb;
  const wasmBase = new URL('../wasm/dist/',           location.href).href;
  frftWorker = new Worker(new URL('../audio/frft-worker.js', location.href).href + '?v=' + cb);
  frftWorker.onmessage = e => {
    const { type } = e.data;
    if      (type === 'ready')  { workerReady = true; startPrecompute(); }
    else if (type === 'result') { handleResult(e.data.jobId, e.data.output); }
    else if (type === 'error')  { setStatus(e.data.message || 'Worker error', 'err'); }
  };
  frftWorker.onerror = () => setStatus('Worker error', 'err');
  frftWorker.postMessage({ type: 'init', jsUrl, wasmBaseUrl: wasmBase, cacheBust: cb });
}
initWorker();
