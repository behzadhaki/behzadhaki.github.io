<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRFT Index Additivity</title>
<script>
  window._wasmCacheBust = Date.now();
  (function() {
    const sp = new URLSearchParams(location.search);
    const w = sp.get('w'), h = sp.get('h');
    const s = document.documentElement.style;
    s.width  = Math.max(200, +(w || 600)) + 'px';
    s.height = Math.max(200, +(h || 400)) + 'px';
    const wave = sp.get('wave');
    if (['sine','triangle','sawtooth','square','sweep'].includes(wave)) window._initWave = wave;
    const freq = parseFloat(sp.get('freq'));
    if (!isNaN(freq) && freq > 0) window._initFreq = freq;
    const disp = sp.get('disp');
    if (disp === 'wave' || disp === 'scope') window._initDisp = disp;
    if (sp.get('interactive') === '0') window._initInteractive = false;
    const win = sp.get('win');
    if (win === 'hann' || win === 'rect') window._initWin = win;
    const a1 = parseFloat(sp.get('alpha1'));
    if (!isNaN(a1) && a1 >= -4 && a1 <= 4) window._initAlpha1 = a1;
    const a2 = parseFloat(sp.get('alpha2'));
    if (!isNaN(a2) && a2 >= -4 && a2 <= 4) window._initAlpha2 = a2;
    if (sp.get('inversion') === '1') window._initInversion = true;
  })();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, select { font: inherit; }

:root {
  --bg:        #1a1a1a;
  --surface:   #1e1e1e;
  --border:    #333333;
  --border2:   #3a3a3a;
  --accent:    #c8902a;
  --accent-lo: #7a5418;
  --text:      #d0d0d0;
  --muted:     #888888;
  --red:       #cc4444;
}

html { font-size: 12px; }
html, body {
  width: 100%; height: 100%;
  background: transparent;
  color: var(--text);
  font-family: "Inter", "Segoe UI", -apple-system, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

body {
  padding: 0.5em;
  gap: 0.4em;
  box-sizing: border-box;
}

#topBar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0.5em;
  padding: 0.25em 0.6em;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  height: 2.4em;
}
#topBar label { font-size: 0.78em; color: var(--muted); white-space: nowrap; }
#topBar select, #topBar input[type="number"] {
  height: 1.8em;
  background: var(--bg); border: 1px solid var(--border2); border-radius: 3px;
  color: var(--text); padding: 0 0.4em; font-size: 0.82em; outline: none; cursor: pointer;
}
#topBar select:focus, #topBar input:focus { border-color: var(--accent); }
#freqNum   { width: 4.5em; -moz-appearance: textfield; }
.alpha-num { width: 3.8em; -moz-appearance: textfield; }
#freqNum::-webkit-inner-spin-button, #freqNum::-webkit-outer-spin-button,
.alpha-num::-webkit-inner-spin-button, .alpha-num::-webkit-outer-spin-button { -webkit-appearance: none; }

#alphaSumLbl {
  font-size: 0.82em; color: var(--accent);
  white-space: nowrap; padding: 0 0.5em;
  border: 1px solid var(--border2); border-radius: 3px;
  height: 1.8em; display: flex; align-items: center;
  background: var(--bg); flex-shrink: 0;
}

#status {
  flex: 1; font-size: 0.78em; color: var(--muted);
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
#status.err { color: var(--red); }

#infoBtn {
  height: 1.8em; padding: 0 0.55em;
  background: var(--surface); color: var(--muted);
  border: 1px solid var(--border2); border-radius: 3px;
  font-size: 0.9em; font-weight: 700; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center;
}
#infoBtn:hover { color: var(--text); }

#main {
  flex: 1; position: relative; overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}

#viewBar {
  position: absolute;
  z-index: 3;
  transform: translateX(-50%);
}
#bgCanvas { position: absolute; inset: 0; pointer-events: none; z-index: 2; }

.panel {
  position: absolute;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: border-color 0.1s;
  z-index: 1;
}
.panel:hover   { border-color: rgba(200,144,42,0.55); }
.panel.active  { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-lo), 0 1px 5px rgba(0,0,0,0.5); }
.panel.computing { cursor: wait; }
.pcv { flex: 1; width: 100%; min-height: 0; display: block; image-rendering: auto; }

.panel-label {
  display: none;
}

/* ── Alpha controls overlaid on the figure ─────────────────────────────────── */
.alpha-overlay {
  position: absolute;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(16,16,16,0.88);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 2px 6px;
  transform: translate(-50%, -100%);
  white-space: nowrap;
  pointer-events: all;
}
.alpha-overlay label {
  font-size: 0.78em;
  font-weight: 700;
  color: var(--accent);
  cursor: default;
  user-select: none;
}
.alpha-overlay input {
  width: 3.8em;
  height: 1.6em;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 2px;
  color: var(--text);
  font-size: 0.80em;
  padding: 0 3px;
  -moz-appearance: textfield;
}
.alpha-overlay input::-webkit-inner-spin-button,
.alpha-overlay input::-webkit-outer-spin-button { -webkit-appearance: none; }
.alpha-overlay input:focus { border-color: var(--accent); outline: none; }
.alpha-overlay input:disabled { opacity: 0.55; cursor: default; }

.tab-group { display: flex; flex-shrink: 0; height: 1.4em; }
.tab {
  padding: 0 0.55em; height: 100%;
  background: var(--surface); color: var(--muted);
  border: 1px solid var(--border2); border-radius: 0;
  font-size: 0.60em; font-weight: 600; cursor: pointer;
}
.tab:first-child { border-radius: 3px 0 0 3px; }
.tab:last-child  { border-radius: 0 3px 3px 0; }
.tab.active { background: var(--accent-lo); color: var(--accent); border-color: var(--accent); }


#paramsBar {
  flex-shrink: 0;
  display: none;
  align-items: center;
  gap: 0.6em;
  flex-wrap: wrap;
  padding: 0.3em 0.8em;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.st-item { display:flex; align-items:baseline; gap:0.25em; white-space:nowrap; }
.st-key  { font-size:0.68em; font-weight:700; letter-spacing:0.05em; color:var(--muted); }
.st-val  { font-size:0.78em; font-weight:700; color:var(--text); }
.st-val.accent { color:var(--accent); }
.st-sep  { color:var(--border2); font-size:0.7em; user-select:none; }

/* ── Activation overlay ── */
#activationOverlay {
  position: fixed; inset: 0;
  background: rgba(26,26,26,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; cursor: pointer;
}
#activateBtn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid #c8902a;
  background: #2a2218;
  color: #c8902a;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: filter 0.15s, transform 0.15s;
}
#activateBtn:hover { filter: brightness(1.3); transform: scale(1.1); }
#activateBtn svg  { width: 18px; height: 18px; fill: currentColor; }
body.auto-started #activationOverlay { display: none; }
</style>
</head>
<body>
<div id="topBar">
  <span id="recomputeControls" style="display:contents">
  <label>Wave</label>
  <select id="waveSel">
    <option value="sine" selected>Sine</option>
    <option value="triangle">Triangle</option>
    <option value="sawtooth">Sawtooth</option>
    <option value="square">Square</option>
    <option value="sweep">Freq sweep</option>
  </select>
  <label id="freqLbl">Freq</label>
  <input id="freqNum" type="number" value="440" min="20" max="20000" step="10">
  <label id="freqHzLbl">Hz</label>
  <label style="margin-left:0.4em">Win</label>
  <select id="winSel">
    <option value="hann" selected>Hann</option>
    <option value="rect">Rectangular</option>
  </select>
  </span>
  <span id="status">Loading&hellip;</span>
  <button id="infoBtn" title="More info &amp; embed instructions">&lt;/&gt;</button>
</div>
<div id="main">
  <canvas id="bgCanvas"></canvas>
  <!-- view toggle overlaid below the Input panel -->
  <div id="viewBar">
    <div class="tab-group">
      <button class="tab active" id="tabWave">Waveform</button>
      <button class="tab" id="tabSpec">Spectrogram</button>
    </div>
  </div>
  <!-- α controls overlaid on the sequential arrows -->
  <div id="alpha1Ctrl" class="alpha-overlay">
    <label id="alpha1Lbl">&alpha;&#x2081;</label>
    <input id="alpha1Num" class="alpha-num" type="number" value="0.5" min="-4" max="4" step="0.05">
  </div>
  <div id="alpha2Ctrl" class="alpha-overlay">
    <label id="alpha2Lbl">&alpha;&#x2082;</label>
    <input id="alpha2Num" class="alpha-num" type="number" value="0.75" min="-4" max="4" step="0.05">
  </div>
</div>
<div id="paramsBar"></div>

<div id="activationOverlay">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
    <button id="activateBtn" title="Activate widget">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
      </svg>
    </button>
    <span style="font-size:9px;color:#c8902a;letter-spacing:0.08em;text-transform:uppercase;font-family:inherit;">press to activate</span>
  </div>
</div>

<script>
'use strict';

const N_SAMPLES = 88200; // 2 s at 44100 Hz

// ── State ─────────────────────────────────────────────────────────────────────
let sampleRate       = 44100;
let dryBuf           = null;
let nodeBufs         = [null, null, null, null, null];
let nodeImagBufs     = [null, null, null, null, null];
let computeDone      = false;
let playStartCtxTime = 0;
let playDuration     = 0;
let playheadRaf      = 0;
let activeIdx        = -1;
let audioCtx         = null;
let activeSrc        = null;
let frftWorker       = null;
let workerReady      = false;
let queuePid         = 0;
let currentJob       = 0;

// ── DOM ───────────────────────────────────────────────────────────────────────
const mainEl      = document.getElementById('main');
const bgCanvas    = document.getElementById('bgCanvas');
const waveSel     = document.getElementById('waveSel');
const freqNum     = document.getElementById('freqNum');
const freqLbl     = document.getElementById('freqLbl');
const freqHzLbl   = document.getElementById('freqHzLbl');
function syncFreqDisabled() {
  const sweep = waveSel.value === 'sweep';
  freqNum.disabled = sweep;
  [freqLbl, freqNum, freqHzLbl].forEach(el => el.style.opacity = sweep ? '0.35' : '');
}
const winSel       = document.getElementById('winSel');
const alpha1Num    = document.getElementById('alpha1Num');
const alpha2Num    = document.getElementById('alpha2Num');
const alpha1CtrlEl = document.getElementById('alpha1Ctrl');
const alpha2CtrlEl = document.getElementById('alpha2Ctrl');
const alpha1Lbl    = document.getElementById('alpha1Lbl');
const alpha2Lbl    = document.getElementById('alpha2Lbl');
const INVERSION    = !!window._initInversion;
const viewBarEl    = document.getElementById('viewBar');
const tabWave      = document.getElementById('tabWave');
const tabSpec     = document.getElementById('tabSpec');
const statusEl    = document.getElementById('status');
const infoBtn     = document.getElementById('infoBtn');

let activeView = 'wave';
function setView(v) {
  activeView = v;
  tabWave.classList.toggle('active', v === 'wave');
  tabSpec.classList.toggle('active', v === 'scope');
  panels.forEach((_, i) => renderPanel(i));
}

// Apply URL params before building UI
if (window._initWave)            waveSel.value    = window._initWave;
if (window._initFreq)            freqNum.value    = String(window._initFreq);
if (window._initDisp)            activeView       = window._initDisp;
if (window._initWin)             winSel.value     = window._initWin;
if (window._initAlpha1 != null)  alpha1Num.value  = String(window._initAlpha1);
if (window._initAlpha2 != null)  alpha2Num.value  = String(window._initAlpha2);
syncFreqDisabled();

if (INVERSION) {
  alpha1Lbl.textContent = 'α';
  alpha2Lbl.textContent = '−α';
  alpha2Num.value    = String(-(parseFloat(alpha1Num.value) || 0));
  alpha2Num.disabled = true;
  alpha2Num.style.display = 'none';
}

function getAlpha1() { return Math.max(-4, Math.min(4, parseFloat(alpha1Num.value) || 0)); }
function getAlpha2() { return Math.max(-4, Math.min(4, parseFloat(alpha2Num.value) || 0)); }
function fmtAlpha(v) { return String(parseFloat(v.toFixed(4))); }


// ── Static mode params bar ────────────────────────────────────────────────────
const INTERACTIVE = window._initInteractive !== false;
if (!INTERACTIVE) {
  alpha1Num.disabled = true;
  alpha2Num.disabled = true;
  const rc   = document.getElementById('recomputeControls');
  rc.innerHTML = '';
  const wave = waveSel.value;
  const freq = parseFloat(freqNum.value);
  const win  = winSel.value === 'hann' ? 'Hann' : 'Rectangular';
  const a1   = getAlpha1(), a2 = getAlpha2();
  const items = [
    { key: 'Wave',   val: wave.charAt(0).toUpperCase() + wave.slice(1) },
    ...(wave !== 'sweep' ? [{ key: 'Freq', val: freq + ' Hz', accent: true }] : []),
    { key: 'Window', val: win },
    { key: INVERSION ? 'α'    : 'α₁',     val: fmtAlpha(a1),      accent: true },
    { key: INVERSION ? '−α'   : 'α₂',     val: fmtAlpha(a2),      accent: true },
    { key: INVERSION ? 'α+(−α)' : 'α₁+α₂', val: INVERSION ? '0' : fmtAlpha(a1 + a2), accent: true },
  ];
  items.forEach((item, i) => {
    if (i > 0) {
      const s = document.createElement('span');
      s.className = 'st-sep'; s.textContent = '·';
      rc.appendChild(s);
    }
    const el = document.createElement('span');
    el.className = 'st-item';
    el.innerHTML = '<span class="st-key">' + item.key + '</span>' +
                   '<span class="st-val' + (item.accent ? ' accent' : '') + '">' + item.val + '</span>';
    rc.appendChild(el);
  });
}

// ── Create 4 panels ───────────────────────────────────────────────────────────
// Node 0: Input  Node 1: After FRFT(α₁)  Node 2: Sequential  Node 3: Direct
const NODE_LABELS = [
  'Input',
  'After FRFT(α₁)',
  'Sequential',
  'Direct',
  'Error  |  Seq − Dir',
];

const panels = NODE_LABELS.map((label, idx) => {
  const div = document.createElement('div');
  div.className = 'panel' + (idx > 0 ? ' computing' : '');
  if (idx < 4) {
    div.addEventListener('click', () => togglePlay(idx));
  } else {
    div.style.cursor = 'default';
  }

  const cv = document.createElement('canvas');
  cv.className = 'pcv';
  div.append(cv);
  mainEl.appendChild(div);

  let labelEl = null;
  if (idx < 4) {
    labelEl = document.createElement('span');
    labelEl.className = 'panel-label';
    labelEl.textContent = label;
    mainEl.appendChild(labelEl);
  }

  return { div, cv, labelEl };
});

tabWave.classList.toggle('active', activeView === 'wave');
tabSpec.classList.toggle('active', activeView === 'scope');

// ── Layout ────────────────────────────────────────────────────────────────────
// Node 0: centered, top row
// Node 1: left col, row 2
// Node 2: left col, row 3
// Node 3: right col, row 3  (same y as Node 2 → horizontal equality line)
// Layout: left-to-right
//   Top row  (y0):  After FRFT(α₁) [col1]  Sequential [col2]
//   Mid row  (y1):                          Error       [col2]
//   Bot row  (y2):                          Direct      [col2]
//   Input [col0] is vertically centered on the Error panel.
//   TOPM (top margin) gives space for arrow labels above the top row panels.
function getNodeRects(mW, mH) {
  // PW = panel width = GAPX = interior gap = mW/6
  // Edge margins (x0, trailing) = mW/12 — half a gap, so total = mW/12+PW+mW/6+PW+mW/6+PW+mW/12 = mW ✓
  const PW    = Math.round(mW / 6);
  const GAPX  = Math.round(mW / 6);   // interior gaps, wide enough for label text
  const SMALL = Math.round(mW / 12);  // edge margins
  const GAPY  = Math.round(mH * 0.07);
  const PH_r  = Math.round(mH * 0.24);
  const PH_e  = PH_r;                 // Error panel same height as output panels
  // y1: Input/Error top positioned so Input center = mH/2
  const y1    = Math.round(mH / 2 - PH_r / 2);
  const y0    = y1 - GAPY - PH_r;    // top row top (After FRFT / Sequential)
  const y2    = y1 + PH_r + GAPY;    // Direct top
  const x0    = SMALL;
  const x1    = x0 + PW + GAPX;
  const x2    = x1 + PW + GAPX;
  const yInp  = y1;                  // Input top = Error top (same height panels)
  return [
    { left: x0, top: yInp, width: PW, height: PH_r },  // 0: Input
    { left: x1, top: y0,   width: PW, height: PH_r },  // 1: After FRFT(α₁)
    { left: x2, top: y0,   width: PW, height: PH_r },  // 2: Sequential
    { left: x2, top: y2,   width: PW, height: PH_r },  // 3: Direct
    { left: x2, top: y1,   width: PW, height: PH_e },  // 4: Error
  ];
}

function layoutAll() {
  const mW = mainEl.clientWidth, mH = mainEl.clientHeight;
  if (mW < 10 || mH < 10) return;
  const dpr = window.devicePixelRatio || 1;

  bgCanvas.width  = Math.round(mW * dpr);
  bgCanvas.height = Math.round(mH * dpr);
  bgCanvas.style.width  = mW + 'px';
  bgCanvas.style.height = mH + 'px';

  const rects = getNodeRects(mW, mH);
  panels.forEach(({ div, cv, labelEl }, idx) => {
    const r = rects[idx];
    Object.assign(div.style, {
      left: r.left + 'px', top: r.top + 'px',
      width: r.width + 'px', height: r.height + 'px',
    });
    cv.width  = Math.round(r.width  * dpr);
    cv.height = Math.round(r.height * dpr);
    renderPanel(idx);

    if (labelEl) {
      labelEl.style.left      = (r.left + r.width / 2) + 'px';
      labelEl.style.top       = (r.top + r.height + 5) + 'px';
      labelEl.style.transform = 'translateX(-50%)';
    }
  });

  // Position view toggle centred below the Input panel (node 0)
  const r0 = rects[0];
  viewBarEl.style.left = (r0.left + r0.width / 2) + 'px';
  viewBarEl.style.top  = (r0.top + r0.height + 6) + 'px';

  drawBg();
}

new ResizeObserver(layoutAll).observe(mainEl);

// ── Background: flow arrows ───────────────────────────────────────────────────
function rectCtr(r) {
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function rectEdge(r, tx, ty) {
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = tx - cx, dy = ty - cy;
  if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) return { x: cx, y: cy };
  const t = Math.min(
    Math.abs(dx) > 0 ? (r.width / 2)  / Math.abs(dx) : Infinity,
    Math.abs(dy) > 0 ? (r.height / 2) / Math.abs(dy) : Infinity
  );
  return { x: cx + dx * t, y: cy + dy * t };
}

function drawArrow(ctx, x1, y1, x2, y2, label, color, dashed) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1.4;
  if (dashed) ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.setLineDash([]);

  if (!dashed) {
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const hl  = 8;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - hl * Math.cos(ang - 0.42), y2 - hl * Math.sin(ang - 0.42));
    ctx.lineTo(x2 - hl * Math.cos(ang + 0.42), y2 - hl * Math.sin(ang + 0.42));
    ctx.closePath();
    ctx.fill();
  }

  if (label) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const len = Math.hypot(x2 - x1, y2 - y1) || 1;
    // perpendicular offset — labels appear above horizontal arrows
    const px =  (y2 - y1) / len * 16;
    const py = -(x2 - x1) / len * 16;
    ctx.font         = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(20,20,20,0.75)';
    ctx.fillRect(mx + px - tw / 2 - 3, my + py - 7, tw + 6, 14);
    ctx.fillStyle = color;
    ctx.fillText(label, mx + px, my + py);
  }
  ctx.restore();
}

function drawBg() {
  const mW = mainEl.clientWidth, mH = mainEl.clientHeight;
  if (mW < 10 || mH < 10) return;
  const dpr = window.devicePixelRatio || 1;
  const ctx = bgCanvas.getContext('2d');
  ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  ctx.save();
  ctx.scale(dpr, dpr);

  const r  = getNodeRects(mW, mH);
  const a1 = getAlpha1(), a2 = getAlpha2();
  const ARROW = 'rgba(200,160,80,0.85)';
  const EQUAL = 'rgba(80,185,80,0.90)';
  const CR = Math.max(6, Math.round(Math.min(mW, mH) * 0.018)); // rounded corner radius

  // ── helpers ──────────────────────────────────────────────────────────────
  const arrowTip = (x, y) => {              // arrowhead pointing right at (x,y)
    const hl = 8;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - hl, y - hl * 0.45);
    ctx.lineTo(x - hl, y + hl * 0.45);
    ctx.closePath();
    ctx.fill();
  };
  const connLabel = (x, yRef, text) => {   // label with its bottom edge at yRef-4
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(16,16,16,0.86)';
    ctx.fillRect(x - tw / 2 - 4, yRef - 20, tw + 8, 17);
    ctx.fillStyle = ARROW;
    ctx.fillText(text, x, yRef - 3);
  };

  ctx.lineWidth = 1.6;

  // xElbow: midpoint of gap between Input right edge and col1 left edge
  const xElbow = r[0].left + r[0].width + Math.round((r[1].left - r[0].left - r[0].width) / 2);

  // ── 0 → 1: Input → After FRFT(α₁)  [Z-shape: right → elbow → UP → right] ──
  {
    const sx = r[0].left + r[0].width, sy = r[0].top + r[0].height / 2;
    const ex = r[1].left,              ey = r[1].top  + r[1].height / 2;
    ctx.strokeStyle = ARROW; ctx.fillStyle = ARROW;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(xElbow - CR, sy);
    ctx.quadraticCurveTo(xElbow, sy, xElbow, sy - CR);  // right→up
    ctx.lineTo(xElbow, ey + CR);
    ctx.quadraticCurveTo(xElbow, ey, xElbow + CR, ey);  // up→right
    ctx.lineTo(ex, ey);
    ctx.stroke();
    arrowTip(ex, ey);
    // Position the α₁ HTML overlay above the elbow
    alpha1CtrlEl.style.left = xElbow + 'px';
    alpha1CtrlEl.style.top  = (ey - 6) + 'px';
  }

  // ── 1 → 2: After FRFT(α₁) → Sequential  [straight horizontal] ──
  {
    const sx = r[1].left + r[1].width, sy = r[1].top + r[1].height / 2;
    const ex = r[2].left,              ey = sy;
    ctx.strokeStyle = ARROW; ctx.fillStyle = ARROW;
    ctx.beginPath();
    ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
    ctx.stroke();
    arrowTip(ex, ey);
    // Position the α₂ HTML overlay above the midpoint of this arrow
    alpha2CtrlEl.style.left = ((sx + ex) / 2) + 'px';
    alpha2CtrlEl.style.top  = (ey - 6) + 'px';
  }

  // ── 0 → 3: Input → Direct  [Z-shape: right → elbow → DOWN → right] ──
  {
    const sx = r[0].left + r[0].width, sy = r[0].top + r[0].height / 2;
    const ex = r[3].left,              ey = r[3].top  + r[3].height / 2;
    ctx.strokeStyle = ARROW; ctx.fillStyle = ARROW;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(xElbow - CR, sy);
    ctx.quadraticCurveTo(xElbow, sy, xElbow, sy + CR);  // right→down
    ctx.lineTo(xElbow, ey - CR);
    ctx.quadraticCurveTo(xElbow, ey, xElbow + CR, ey);  // down→right
    ctx.lineTo(ex, ey);
    ctx.stroke();
    arrowTip(ex, ey);
    if (!INVERSION) connLabel((xElbow + r[3].left) / 2, ey, 'α₁+α₂ = ' + fmtAlpha(a1 + a2));
  }

  // ── Error connections: dashed verticals from Sequential & Direct into Error ──
  if (computeDone) {
    const ex = r[4].left + r[4].width / 2;
    ctx.strokeStyle = EQUAL; ctx.lineWidth = 1.2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(ex, r[2].top + r[2].height); ctx.lineTo(ex, r[4].top);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ex, r[3].top); ctx.lineTo(ex, r[4].top + r[4].height);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

// ── Window function ───────────────────────────────────────────────────────────
function applyWindow(buf, noWindow) {
  const n = buf.length;
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const w = noWindow ? 1.0 : 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
    out[i] = buf[i] * w;
  }
  return out;
}

// ── Signal generation ─────────────────────────────────────────────────────────
function generateSignal(freq, n, sr, wave) {
  const buf = new Float32Array(n);
  if (wave === 'triangle') {
    for (let i = 0; i < n; i++)
      buf[i] = (2 / Math.PI) * Math.asin(Math.sin(2 * Math.PI * freq * i / sr));
  } else if (wave === 'sawtooth') {
    for (let i = 0; i < n; i++)
      buf[i] = 2 * ((freq * i / sr) % 1) - 1;
  } else if (wave === 'square') {
    for (let i = 0; i < n; i++)
      buf[i] = Math.sin(2 * Math.PI * freq * i / sr) >= 0 ? 1 : -1;
  } else if (wave === 'sweep') {
    const f0 = 20, f1 = Math.min(sr / 2 - 100, 20000);
    for (let i = 0; i < n; i++)
      buf[i] = Math.sin(2 * Math.PI * (f0 * i + (f1 - f0) * i * i / (2 * n)) / sr);
  } else {
    for (let i = 0; i < n; i++)
      buf[i] = Math.sin(2 * Math.PI * freq * i / sr);
  }
  return buf;
}

// ── Precompute: 3 sequential FRFT jobs ───────────────────────────────────────
// Job 0: FRFT(α₁, input)                  → nodeBufs[1]+nodeImagBufs[1]  (raw complex engine output)
// Job 1: FRFT(α₂, complex_intermediate)  → nodeBufs[2]  (rawInput — no re-fftshift)
// Job 2: FRFT(α₁+α₂, input)             → nodeBufs[3]  (standard path, identical by additivity)
// Post:  error = nodeBufs[2] − nodeBufs[3] → nodeBufs[4]  (floating-point noise only)
function startPrecompute() {
  if (!workerReady) return;
  stopPlayback();
  computeDone = false;
  nodeBufs     = [null, null, null, null, null];
  nodeImagBufs = [null, null, null, null, null];
  if (computeSTFT._cache) computeSTFT._cache = new WeakMap();
  panels.forEach((p, i) => { if (i > 0) p.div.classList.add('computing'); renderPanel(i); });

  const freq  = Math.max(20, Math.min(20000, parseFloat(freqNum.value) || 440));
  const noWin = winSel.value === 'rect';
  dryBuf      = generateSignal(freq, N_SAMPLES, sampleRate, waveSel.value);
  nodeBufs[0] = applyWindow(dryBuf, noWin);
  renderPanel(0);

  queuePid++;
  currentJob = 0;
  setStatus('Computing 1/3…');
  sendCurrentJob();
}

function sendCurrentJob() {
  const noWin = winSel.value === 'rect';
  const pid   = queuePid;
  if (currentJob === 0) {
    // returnComplex: return raw engine output (real+imag, no synthesis window)
    // so job 1 can feed it — fftshifted — back into the engine for FRFT(α₂).
    frftWorker.postMessage({
      type: 'process', samples: dryBuf, alpha: getAlpha1(),
      bufSize: N_SAMPLES, overlapFactor: 1, noWindow: noWin, halfSpectrum: false,
      returnComplex: true,
      jobId: pid * 10,
    });
  } else if (currentJob === 1) {
    // rawInput: fftshift the complex intermediate before the engine (same pre-shift
    // as the standard path, but no analysis window). The engine's internal fftshift
    // then cancels, giving FRFT(α₂)[FRFT(α₁)[windowed_x]] = FRFT(α₁+α₂)[windowed_x].
    frftWorker.postMessage({
      type: 'process',
      samples:     nodeBufs[1],
      samplesImag: nodeImagBufs[1],
      alpha: getAlpha2(),
      bufSize: N_SAMPLES, overlapFactor: 1, noWindow: noWin, halfSpectrum: false,
      rawInput: true,
      jobId: pid * 10 + 1,
    });
  } else if (currentJob === 2) {
    frftWorker.postMessage({
      type: 'process', samples: dryBuf, alpha: getAlpha1() + getAlpha2(),
      bufSize: N_SAMPLES, overlapFactor: 1, noWindow: noWin, halfSpectrum: false,
      jobId: pid * 10 + 2,
    });
  }
}

function handleResult(jobId, output, outputImag) {
  const pid    = Math.floor(jobId / 10);
  if (pid !== queuePid) return;
  const jobIdx  = jobId % 10;
  const nodeIdx = jobIdx + 1;
  nodeBufs[nodeIdx] = output;
  if (jobIdx === 0) nodeImagBufs[nodeIdx] = outputImag || null;
  panels[nodeIdx].div.classList.remove('computing');
  renderPanel(nodeIdx);
  if (jobIdx < 2) {
    currentJob = jobIdx + 1;
    setStatus('Computing ' + (jobIdx + 2) + '/3…');
    sendCurrentJob();
  } else {
    const errBuf = new Float32Array(nodeBufs[2].length);
    for (let i = 0; i < errBuf.length; i++) errBuf[i] = nodeBufs[2][i] - nodeBufs[3][i];
    nodeBufs[4] = errBuf;
    panels[4].div.classList.remove('computing');
    renderPanel(4);
    computeDone = true;
    setStatus('');
    drawBg();
  }
}

// ── Panel rendering ───────────────────────────────────────────────────────────
function renderPanel(idx) {
  const { cv } = panels[idx];
  const W = cv.width, H = cv.height;
  if (W < 2 || H < 2) return;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0c0c0c';
  ctx.fillRect(0, 0, W, H);
  const buf = nodeBufs[idx];
  if (!buf) return;
  if (idx === 4) {
    if (activeView === 'scope') renderDiffSpectrogram(ctx, W, H);
    else                        renderErrorPanel(ctx, buf, W, H);
    return;
  }
  if (activeView === 'scope') renderSpectrogram(ctx, buf, W, H);
  else                        renderWaveform(ctx, buf, W, H);
  // Node label — top-left corner of canvas
  {
    const dpr = window.devicePixelRatio || 1;
    const fs  = Math.round(11 * dpr);
    const pad = Math.round(5 * dpr);
    ctx.font = fs + 'px -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const tw = ctx.measureText(NODE_LABELS[idx]).width;
    ctx.fillStyle = 'rgba(15,15,15,0.68)';
    ctx.fillRect(pad, pad, tw + pad * 2, fs + pad);
    ctx.fillStyle = 'rgba(200,200,200,0.80)';
    ctx.fillText(NODE_LABELS[idx], pad * 2, Math.round(pad * 1.2));
  }
  if (idx === activeIdx && audioCtx) {
    const frac = Math.min(1, (audioCtx.currentTime - playStartCtxTime) / playDuration);
    const px   = Math.round(frac * W);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth   = 1.5;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
  }
}

function renderWaveform(ctx, buf, W, H) {
  const n = buf.length;
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < n; i++) { if (buf[i] < mn) mn = buf[i]; if (buf[i] > mx) mx = buf[i]; }
  const range = mx - mn;
  if (range < 1e-10) return;
  const midY = (1 - (0 - mn) / range) * H;
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth   = 0.5;
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();
  ctx.strokeStyle = '#c8902a';
  ctx.lineWidth   = Math.max(0.7, W / 500);
  ctx.beginPath();
  for (let x = 0; x < W; x++) {
    const val = buf[Math.floor(x / W * n)];
    const y   = (1 - (val - mn) / range) * H;
    if (x === 0) ctx.moveTo(0.5, y); else ctx.lineTo(x + 0.5, y);
  }
  ctx.stroke();
}

function drawPanelLabel(ctx, text) {
  const dpr = window.devicePixelRatio || 1;
  const fs  = Math.round(11 * dpr);
  const pad = Math.round(5 * dpr);
  ctx.font = fs + 'px -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(15,15,15,0.68)';
  ctx.fillRect(pad, pad, tw + pad * 2, fs + pad);
  ctx.fillStyle = 'rgba(200,200,200,0.80)';
  ctx.fillText(text, pad * 2, Math.round(pad * 1.2));
}

function renderErrorPanel(ctx, buf, W, H) {
  const n = buf.length;

  // Scale relative to the Sequential output so the error is visually comparable
  const ref = nodeBufs[2];
  let refPeak = 0;
  if (ref) for (let i = 0; i < ref.length; i++) { const v = Math.abs(ref[i]); if (v > refPeak) refPeak = v; }
  const range = refPeak < 1e-12 ? 1 : refPeak * 2;

  const midY = H / 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth   = 0.5;
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();

  ctx.strokeStyle = 'rgba(190,190,190,0.85)';
  ctx.lineWidth   = Math.max(0.7, W / 500);
  ctx.beginPath();
  for (let x = 0; x < W; x++) {
    const val = buf[Math.floor(x / W * n)];
    const y   = (0.5 - val / range) * H;
    if (x === 0) ctx.moveTo(0.5, y); else ctx.lineTo(x + 0.5, y);
  }
  ctx.stroke();
  drawPanelLabel(ctx, 'Error');
}

function diffColor(t) {
  // t: -1 → blue (Direct louder), 0 → black, +1 → orange (Sequential louder)
  if (t >= 0) return [Math.round(200*t), Math.round(144*t), Math.round(42*t)];
  const a = -t;
  return [Math.round(42*a), Math.round(106*a), Math.round(200*a)];
}

function renderDiffSpectrogram(ctx, W, H) {
  const stft2 = computeSTFT(nodeBufs[2]);
  const stft3 = computeSTFT(nodeBufs[3]);
  if (!stft2 || !stft3) return;
  const { magDB: db2, numFrames, NUM_BINS } = stft2;
  const { magDB: db3 } = stft3;
  const RANGE = 20; // ±20 dB display range
  const img  = ctx.createImageData(W, H);
  const px4  = img.data;
  for (let y = 0; y < H; y++) {
    const kf = (1 - (y + 0.5) / H) * (NUM_BINS - 1);
    const k0 = Math.max(0, Math.floor(kf)), k1 = Math.min(NUM_BINS-1, k0+1), ky = kf-k0;
    for (let x = 0; x < W; x++) {
      const ff = (x + 0.5) / W * (numFrames - 1);
      const f0 = Math.max(0, Math.floor(ff)), f1 = Math.min(numFrames-1, f0+1), fx = ff-f0;
      const d2 = (db2[f0*NUM_BINS+k0]*(1-fx) + db2[f1*NUM_BINS+k0]*fx) * (1-ky)
               + (db2[f0*NUM_BINS+k1]*(1-fx) + db2[f1*NUM_BINS+k1]*fx) * ky;
      const d3 = (db3[f0*NUM_BINS+k0]*(1-fx) + db3[f1*NUM_BINS+k0]*fx) * (1-ky)
               + (db3[f0*NUM_BINS+k1]*(1-fx) + db3[f1*NUM_BINS+k1]*fx) * ky;
      const t  = Math.max(-1, Math.min(1, (d2 - d3) / RANGE));
      const [r, g, b] = diffColor(t);
      const i4 = (y * W + x) * 4;
      px4[i4]=r; px4[i4+1]=g; px4[i4+2]=b; px4[i4+3]=255;
    }
  }
  ctx.putImageData(img, 0, 0);
  drawPanelLabel(ctx, 'Error');
}

function renderSpectrogram(ctx, buf, W, H) {
  const stft = computeSTFT(buf);
  if (!stft) return;
  const { magDB, numFrames, NUM_BINS, renderMin, renderMax } = stft;
  const img = ctx.createImageData(W, H);
  const px4 = img.data;
  for (let y = 0; y < H; y++) {
    const kf = (1 - (y + 0.5) / H) * (NUM_BINS - 1);
    const k0 = Math.max(0, Math.floor(kf));
    const k1 = Math.min(NUM_BINS - 1, k0 + 1);
    const ky = kf - k0;
    for (let x = 0; x < W; x++) {
      const ff = (x + 0.5) / W * (numFrames - 1);
      const f0 = Math.max(0, Math.floor(ff));
      const f1 = Math.min(numFrames - 1, f0 + 1);
      const fx = ff - f0;
      const db = (magDB[f0*NUM_BINS+k0]*(1-fx) + magDB[f1*NUM_BINS+k0]*fx) * (1-ky)
               + (magDB[f0*NUM_BINS+k1]*(1-fx) + magDB[f1*NUM_BINS+k1]*fx) * ky;
      const t  = Math.max(0, Math.min(1, (db - renderMin) / (renderMax - renderMin)));
      const [r, g, b] = spectrogramColor(t);
      const i4 = (y * W + x) * 4;
      px4[i4]=r; px4[i4+1]=g; px4[i4+2]=b; px4[i4+3]=255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ── STFT (WeakMap cache keyed by buffer reference) ────────────────────────────
function computeSTFT(samples) {
  if (!samples) return null;
  if (!computeSTFT._cache) computeSTFT._cache = new WeakMap();
  const cached = computeSTFT._cache.get(samples);
  if (cached) return cached;

  const FFT_SIZE = 2048, HOP = 256;
  const NUM_BINS = FFT_SIZE >> 1;
  const numFrames = Math.max(1, Math.floor((samples.length - FFT_SIZE) / HOP) + 1);

  const win = new Float32Array(FFT_SIZE);
  for (let i = 0; i < FFT_SIZE; i++)
    win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (FFT_SIZE - 1));

  const magDB = new Float32Array(numFrames * NUM_BINS);
  const re = new Float64Array(FFT_SIZE), im = new Float64Array(FFT_SIZE);
  let dBmax = -Infinity;

  for (let f = 0; f < numFrames; f++) {
    const off = f * HOP;
    for (let i = 0; i < FFT_SIZE; i++) {
      re[i] = (off + i < samples.length ? samples[off + i] : 0) * win[i]; im[i] = 0;
    }
    fftInPlace(re, im, FFT_SIZE);
    for (let k = 0; k < NUM_BINS; k++) {
      const db = 20 * Math.log10(Math.sqrt(re[k]*re[k] + im[k]*im[k]) / FFT_SIZE + 1e-10);
      magDB[f * NUM_BINS + k] = db;
      if (db > dBmax) dBmax = db;
    }
  }

  const renderMax = Math.max(dBmax, -20);
  const renderMin = renderMax - 60;
  const result = { magDB, numFrames, NUM_BINS, renderMin, renderMax };
  computeSTFT._cache.set(samples, result);
  return result;
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function togglePlay(idx) {
  if (activeIdx === idx) stopPlayback(); else startPlay(idx);
}

function startPlay(idx) {
  stopPlayback();
  const buf = nodeBufs[idx];
  if (!buf) return;
  if (!audioCtx) audioCtx = new AudioContext({ sampleRate });
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const gain = audioCtx.createGain(); gain.gain.value = 0.5;
  gain.connect(audioCtx.destination);
  const ab = audioCtx.createBuffer(1, buf.length, sampleRate);
  ab.copyToChannel(buf, 0);
  activeSrc = audioCtx.createBufferSource();
  activeSrc.buffer = ab;
  activeSrc.connect(gain);
  activeSrc.onended = () => stopPlayback();
  activeSrc.start();
  playStartCtxTime = audioCtx.currentTime;
  playDuration     = buf.length / sampleRate;
  activeIdx = idx;
  panels[idx].div.classList.add('active');
  drawBg();
  startPlayheadLoop();
}

function stopPlayback() {
  cancelAnimationFrame(playheadRaf);
  if (activeSrc) { try { activeSrc.stop(); } catch {} activeSrc = null; }
  if (activeIdx >= 0) {
    panels[activeIdx].div.classList.remove('active');
    renderPanel(activeIdx);
  }
  activeIdx = -1;
  drawBg();
}

function startPlayheadLoop() {
  cancelAnimationFrame(playheadRaf);
  function tick() {
    if (activeIdx < 0) return;
    renderPanel(activeIdx);
    playheadRaf = requestAnimationFrame(tick);
  }
  playheadRaf = requestAnimationFrame(tick);
}

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

}

// ── FFT ───────────────────────────────────────────────────────────────────────
function fftInPlace(re, im, N) {
  let j = 0;
  for (let i = 1; i < N; i++) {
    let bit = N >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i]=re[j]; re[j]=t;
          t = im[i]; im[i]=im[j]; im[j]=t;
    }
  }
  for (let len = 2; len <= N; len <<= 1) {
    const half = len >> 1;
    const ang  = -2 * Math.PI / len;
    const wcos = Math.cos(ang), wsin = Math.sin(ang);
    for (let i = 0; i < N; i += len) {
      let wr = 1, wi = 0;
      for (let k = 0; k < half; k++) {
        const tr = wr*re[i+k+half] - wi*im[i+k+half];
        const ti = wr*im[i+k+half] + wi*re[i+k+half];
        re[i+k+half] = re[i+k]-tr; im[i+k+half] = im[i+k]-ti;
        re[i+k] += tr;             im[i+k] += ti;
        const nwr = wr*wcos - wi*wsin;
        wi = wr*wsin + wi*wcos; wr = nwr;
      }
    }
  }
}

// ── Colormap ──────────────────────────────────────────────────────────────────
const CMAP = [[5,5,25],[100,0,150],[200,50,100],[255,140,20],[255,255,100]];
function spectrogramColor(t) {
  const s  = t * (CMAP.length - 1);
  const lo = Math.floor(s);
  const hi = Math.min(lo + 1, CMAP.length - 1);
  const f  = s - lo;
  return [
    Math.round(CMAP[lo][0] + f*(CMAP[hi][0]-CMAP[lo][0])),
    Math.round(CMAP[lo][1] + f*(CMAP[hi][1]-CMAP[lo][1])),
    Math.round(CMAP[lo][2] + f*(CMAP[hi][2]-CMAP[lo][2])),
  ];
}

// ── Worker ────────────────────────────────────────────────────────────────────
function initWorker() {
  const cb       = window._wasmCacheBust;
  const jsUrl    = new URL('../wasm/dist/frft.js',    location.href).href + '?v=' + cb;
  const wasmBase = new URL('../wasm/dist/',           location.href).href;
  frftWorker = new Worker(new URL('../audio/frft-worker.js', location.href).href + '?v=' + cb);
  frftWorker.onmessage = e => {
    const { type } = e.data;
    if      (type === 'ready')  { workerReady = true; startPrecompute(); }
    else if (type === 'result') { handleResult(e.data.jobId, e.data.output, e.data.outputImag); }
    else if (type === 'error')  { setStatus(e.data.message || 'Worker error', 'err'); }
  };
  frftWorker.onerror = () => setStatus('Worker error', 'err');
  frftWorker.postMessage({ type: 'init', jsUrl, wasmBaseUrl: wasmBase, cacheBust: cb });
}
(function () {
  const autoActivate = new URLSearchParams(location.search).get('autoactivate') === '1';
  if (autoActivate) {
    document.body.classList.add('auto-started');
    initWorker();
  } else {
    document.getElementById('activateBtn').addEventListener('click', function () {
      document.getElementById('activationOverlay').style.display = 'none';
      initWorker();
    });
  }
})();
</script>
