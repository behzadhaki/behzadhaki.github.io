{% if page.id %}
  {% assign class = '' %}
  {% elsif page.url contains 'tag' %}
  {% assign class = '' %}
  {% else %}
  {% assign class = 'header--top' %}
{% endif %}

<!-- begin header -->
<header class="header {{ class }}">
  <div class="container">
    <div class="row">
      <div class="header__inner col col-12">

      <div class="logo">
        <a class="logo__link" href="{{ site.baseurl }}/">
          <span class="logo__first">Behzad</span><span class="logo__last"> Haki</span>
        </a>
      </div>

      <div class="menu-overlay">
        <nav class="main-nav">
          <div class="main-nav__box">
            <div class="nav__icon-close">
              <i class="fa-solid fa-xmark"></i>
            </div>
            <div class="nav-grid">
              <div class="nav-grid__item">
                <h2 class="nav-grid__title">{{ site.data.settings.title }}</h2>
                <div class="mobile-nav">
                  {% include navigation.html %}
                </div>
              </div>
            </div>
          </div>
        </nav>
      </div>

      <div class="navigation">
        <div class="top-nav">
          {% include navigation.html %}
        </div>
      </div>

      <div class="nav-buttons">
        <i class="nav__icon nav__icon-menu fa-solid fa-bars"></i>
        <div class="search-button">
          <i class="nav__icon nav__icon-search fa-solid fa-magnifying-glass"></i>
          <span>Search</span>
        </div>
        <button id="light-toggle" class="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
          <i class="fa-solid fa-sun theme-toggle-sun"></i>
          <i class="fa-solid fa-moon theme-toggle-moon"></i>
        </button>
      </div>

      </div>
    </div>
  </div>
</header>
<!-- end header -->

{% include search.html %}
