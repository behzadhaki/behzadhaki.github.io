{% if site.tags.size >= 1 %}
<div class="col col-12">
  <div class="widget widget-tag-cloud">
    <div class="widget__head">
      <h3 class="widget__title">Explore Tags</h3>
    </div>
    <div class="tag__cloud">
    {% assign sorted_tags = site.tags | sort %}
    {% for tag in sorted_tags %}
      <span>{{ tag[0] }}</span>
    {% endfor %}
    </div>
  </div>
</div>
{% endif %}
