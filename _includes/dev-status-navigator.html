<div class="dev-status-circle" data-level="{{ include.level | default: 1 }}">
  <svg class="dsc-svg" viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
    <g class="dsc-dots"></g>
    <foreignObject x="25" y="25" width="70" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" class="dsc-inner-label"></div>
    </foreignObject>
  </svg>
</div>

<style>
.dev-status-circle {
  display: none;
}
.dsc-svg { overflow: visible; }
.dsc-dot-on  { fill: #777; }
.dsc-dot-off { fill: rgba(120,120,120,0.22); }
.dsc-inner-label {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 9.5px;
  line-height: 1.35;
  color: #999;
  word-break: break-word;
  hyphens: auto;
}
html[data-theme='light'] .dsc-dot-on  { fill: #555; }
html[data-theme='light'] .dsc-dot-off { fill: rgba(0,0,0,0.1); }
html[data-theme='light'] .dsc-inner-label { color: #666; }
</style>

<script>
(function () {
  function buildCircles() {
    document.querySelectorAll('.dev-status-circle:not([data-dsc-built])').forEach(function (el) {
      el.setAttribute('data-dsc-built', '1');
      var level = parseInt(el.getAttribute('data-level'), 10);
      var statusMap = {
        1: { label: 'Early Stages',      pct: 20  },
        2: { label: 'Actively Ongoing',  pct: 45  },
        3: { label: 'Late Stages',       pct: 70  },
        4: { label: 'Under Maintenance', pct: 90  },
        5: { label: 'Finished',          pct: 100 }
      };
      var s = statusMap[level] || { label: 'Unknown', pct: 0 };
      var TOTAL = 24, cx = 60, cy = 60, R = 44, dr = 4.6;
      var filled = Math.round(s.pct / 100 * TOTAL);
      var ns = 'http://www.w3.org/2000/svg';
      var g = el.querySelector('.dsc-dots');
      for (var i = 0; i < TOTAL; i++) {
        var a = (i / TOTAL) * 2 * Math.PI - Math.PI / 2;
        var c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', (cx + R * Math.cos(a)).toFixed(2));
        c.setAttribute('cy', (cy + R * Math.sin(a)).toFixed(2));
        c.setAttribute('r', dr);
        c.setAttribute('class', i < filled ? 'dsc-dot-on' : 'dsc-dot-off');
        g.appendChild(c);
      }
      el.querySelector('.dsc-inner-label').textContent = s.label;
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildCircles);
  } else {
    buildCircles();
  }
})();
</script>
