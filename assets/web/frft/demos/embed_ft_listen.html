<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen to FT Directly</title>
<script>
  (function () {
    const sp = new URLSearchParams(location.search);
    const w = sp.get('w'), h = sp.get('h');
    if (w) document.documentElement.style.width  = Math.max(200, +w) + 'px';
    if (h) document.documentElement.style.height = Math.max(100, +h) + 'px';
    const t  = sp.get('type');
    const pt = sp.get('part');
    window._p = {
      type:        ['sine','triangle','sawtooth','square','sweep'].includes(t) ? t : 'sine',
      freq:        Math.max(20, parseFloat(sp.get('freq')) || 440),
      part:        ['real','imag'].includes(pt) ? pt : 'imag',
      exact:       sp.get('exact') === '1',
      interactive: sp.get('interactive') !== '0',
    };
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button, input, select, textarea { font: inherit; }

  :root {
    --bg:        #1a1a1a;
    --surface:   #222222;
    --surface2:  #282828;
    --border:    #333333;
    --border2:   #3a3a3a;
    --accent:    #c8902a;
    --accent-lo: #7a5418;
    --text:      #d0d0d0;
    --muted:     #aaaaaa;
    --red:       #cc4444;
  }

  html { font-size: 12px; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    color: var(--text);
    font-family: "Inter", "Segoe UI", -apple-system, sans-serif;
    overflow: hidden;
  }

  .layout {
    display: flex; flex-direction: column;
    gap: 0.4em; padding: 0.4em; height: 100%;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.55em 0.75em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 1px 3px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 0.35em; min-height: 0;
  }

  button {
    height: 100%; padding: 0 0.75em;
    border-radius: 3px; font-size: 0.82em; font-weight: 700;
    letter-spacing: 0.03em; cursor: pointer; transition: filter .12s;
    white-space: nowrap; border: 1px solid transparent;
    display: flex; align-items: center;
  }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:active:not(:disabled) { filter: brightness(0.9); }
  button:disabled { opacity: .3; cursor: default; }

  #playBtn { width: 2.5em; justify-content: center; }
  .btn-ok      { background: #2a2218; color: var(--accent); border-color: var(--accent-lo); }
  .btn-playing { background: var(--accent-lo); color: #f0c060; border-color: var(--accent); }

  .controls-row {
    display: flex; align-items: stretch; gap: 0.4em; flex: 1; min-height: 0;
  }

  .tab-group { display: flex; flex-shrink: 0; }
  .tab {
    height: 100%; padding: 0 0.7em;
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border2); border-radius: 0;
    font-size: 0.80em; font-weight: 600; cursor: pointer;
    display: flex; align-items: center;
  }
  .tab:first-child { border-radius: 3px 0 0 3px; }
  .tab:last-child  { border-radius: 0 3px 3px 0; }
  .tab.active { background: var(--accent-lo); color: var(--accent); border-color: var(--accent); }

  #infoBtn {
    height: 100%; padding: 0 0.55em;
    background: var(--surface2); color: var(--muted);
    border: 1px solid var(--border2); border-radius: 3px;
    font-size: 0.9em; font-weight: 700; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #infoBtn:hover { color: var(--text); border-color: var(--border); }

  .spec-area {
    flex: 1; min-height: 0; position: relative;
  }
  #specCanvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; display: block;
    border-radius: 3px; background: #0a0a0a;
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  }

  .settings-row { display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; }
  .st-item { display: flex; align-items: baseline; gap: 0.25em; white-space: nowrap; }
  .st-key  { font-size: 0.68em; font-weight: 700; letter-spacing: 0.05em; color: var(--muted); }
  .st-val  { font-size: 0.78em; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
  .st-val.accent { color: var(--accent); }
  .st-sep  { color: var(--border2); font-size: 0.7em; flex-shrink: 0; user-select: none; }

  #recomputeControls { display: contents; }
  #recomputeControls label {
    font-size: 0.78em; color: var(--muted); white-space: nowrap;
    display: flex; align-items: center;
  }
  #recomputeControls select,
  #recomputeControls input[type="number"] {
    height: 100%; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 3px; color: var(--text); padding: 0 0.4em;
    font-size: 0.80em; outline: none; cursor: pointer;
  }
  #recomputeControls select:focus,
  #recomputeControls input:focus { border-color: var(--accent); }
  #recomputeControls select:disabled,
  #recomputeControls input:disabled { opacity: 0.35; cursor: default; }
  #freqNum { width: 4.5em; -moz-appearance: textfield; }
  #freqNum::-webkit-inner-spin-button,
  #freqNum::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>

<div class="layout">

  <div class="card" style="padding: 0.4em 0.75em;">
    <div class="controls-row" id="ctrlRow">
      <button class="btn-ok" id="playBtn" disabled>▶</button>
      <span id="recomputeControls">
        <select id="waveSel">
          <option value="sine" selected>Sine</option>
          <option value="triangle">Triangle</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="square">Square</option>
          <option value="sweep">Sweep</option>
        </select>
        <input id="freqNum" type="number" value="440" min="20" max="20000" step="10">
        <label id="freqHzLbl">Hz</label>
      </span>
      <div class="tab-group">
        <button class="tab" id="tabReal">Re</button>
        <button class="tab" id="tabImag">Im</button>
      </div>
      <div class="tab-group">
        <button class="tab" id="exactBtn" title="Snap frequency to nearest DFT bin — gives purely imaginary DFT for sine">Exact</button>
      </div>
      <button id="infoBtn" title="More info" style="margin-left:auto">&lt;/&gt;</button>
    </div>
  </div>

  <div class="spec-area">
    <canvas id="specCanvas"></canvas>
  </div>

  <div class="card" style="padding:0.35em 0.75em; flex:none;" id="settingsPanel"></div>

</div>

<script>
'use strict';

const SR    = 44100;
const N_FFT = 131072;
const p     = window._p;

let ftData      = null;  // { re, im, mag: Float32Array } all normalized independently
let playBuf     = null;  // Float32Array (N_FFT) in fftshift order (neg→pos freq)
let activePart  = p.part;
let activeExact = p.exact;
let snappedFreq = null;

let audioCtx         = null;
let activeSrc        = null;
let isPlaying        = false;
let playStartCtxTime = 0;
let animFrame        = null;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const playBtn    = document.getElementById('playBtn');
const tabReal    = document.getElementById('tabReal');
const tabImag    = document.getElementById('tabImag');
const exactBtn   = document.getElementById('exactBtn');
const infoBtn    = document.getElementById('infoBtn');
const specCanvas = document.getElementById('specCanvas');
const waveSel    = document.getElementById('waveSel');
const freqNum    = document.getElementById('freqNum');
const freqHzLbl  = document.getElementById('freqHzLbl');

// ── Tab sync ──────────────────────────────────────────────────────────────────
function syncPartTabs() {
  tabReal.classList.toggle('active', activePart === 'real');
  tabImag.classList.toggle('active', activePart === 'imag');
}
function syncExactBtn() {
  exactBtn.classList.toggle('active', activeExact);
}
syncPartTabs(); syncExactBtn();

// ── Interactive / static ──────────────────────────────────────────────────────
const INTERACTIVE = p.interactive;
if (!INTERACTIVE) {
  document.getElementById('recomputeControls').style.display = 'none';
} else {
  waveSel.value = p.type;
  freqNum.value = p.freq;
  syncFreqDisabled();
  waveSel.addEventListener('change', () => { p.type = waveSel.value; syncFreqDisabled(); compute(); });
  freqNum.addEventListener('change', () => { p.freq = Math.max(20, parseFloat(freqNum.value) || 440); compute(); });
}

function syncFreqDisabled() {
  const s = waveSel.value === 'sweep';
  freqNum.disabled = s;
  freqHzLbl.style.opacity = s ? '0.35' : '';
  freqNum.style.opacity   = s ? '0.35' : '';
}

// ── Tab listeners ─────────────────────────────────────────────────────────────
tabReal.addEventListener('click', () => {
  if (activePart !== 'real') {
    activePart = 'real'; syncPartTabs(); updatePlayBuf();
    if (!isPlaying) renderFrequency();
    buildSettingsPanel();
  }
});
tabImag.addEventListener('click', () => {
  if (activePart !== 'imag') {
    activePart = 'imag'; syncPartTabs(); updatePlayBuf();
    if (!isPlaying) renderFrequency();
    buildSettingsPanel();
  }
});
exactBtn.addEventListener('click', () => {
  activeExact = !activeExact;
  syncExactBtn();
  compute();
});

// ── ResizeObserver ────────────────────────────────────────────────────────────
const specRO = new ResizeObserver(() => {
  const dpr  = window.devicePixelRatio || 1;
  const rect = specCanvas.getBoundingClientRect();
  const cw   = Math.max(1, Math.floor(rect.width  * dpr));
  const ch   = Math.max(1, Math.floor(rect.height * dpr));
  if (specCanvas.width !== cw || specCanvas.height !== ch) {
    specCanvas.width  = cw;
    specCanvas.height = ch;
    if (ftData) renderFrequency(isPlaying ? getCurrentProgress() : undefined);
    else clearCanvas();
  }
});
specRO.observe(specCanvas);

// ── Play / stop ───────────────────────────────────────────────────────────────
playBtn.addEventListener('click', () => { isPlaying ? stopPlayback() : startPlayback(); });

function startPlayback() {
  if (!playBuf) return;
  if (activeSrc) { try { activeSrc.stop(); } catch (_) {} activeSrc = null; }
  if (audioCtx)  { audioCtx.close(); audioCtx = null; }
  audioCtx = new AudioContext({ sampleRate: SR });
  const buf = audioCtx.createBuffer(1, playBuf.length, SR);
  buf.copyToChannel(playBuf, 0);
  activeSrc        = audioCtx.createBufferSource();
  activeSrc.buffer = buf;
  activeSrc.connect(audioCtx.destination);
  activeSrc.start();
  playStartCtxTime    = audioCtx.currentTime;
  activeSrc.onended   = stopPlayback;
  isPlaying           = true;
  playBtn.textContent = '■';
  playBtn.className   = 'btn-playing';
  scheduleAnim();
}

function stopPlayback() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  if (activeSrc) { try { activeSrc.stop(); } catch (_) {} activeSrc = null; }
  if (audioCtx)  { audioCtx.close(); audioCtx = null; }
  isPlaying           = false;
  playBtn.textContent = '▶';
  playBtn.className   = 'btn-ok';
  renderFrequency();
}

function getCurrentProgress() {
  if (!audioCtx || !isPlaying) return 0;
  return Math.min(1, (audioCtx.currentTime - playStartCtxTime) / (N_FFT / SR));
}

function scheduleAnim() {
  animFrame = requestAnimationFrame(() => {
    if (!isPlaying) return;
    const prog = getCurrentProgress();
    renderFrequency(prog);
    if (prog < 1) scheduleAnim();
  });
}

// ── Info ──────────────────────────────────────────────────────────────────────
infoBtn.addEventListener('click', () => {
  window.open('https://behzadhaki.com/works/frft-in-the-browser/#listen-to-ft-directly', '_blank');
});

// ── Signal generation ─────────────────────────────────────────────────────────
function generateSignal(type, seconds, sr, freq) {
  const n   = Math.floor(seconds * sr);
  const buf = new Float32Array(n);
  if (type === 'sine') {
    for (let i = 0; i < n; i++) buf[i] = Math.sin(2 * Math.PI * freq * i / sr);
  } else if (type === 'triangle') {
    for (let i = 0; i < n; i++) buf[i] = (2 / Math.PI) * Math.asin(Math.sin(2 * Math.PI * freq * i / sr));
  } else if (type === 'sawtooth') {
    for (let i = 0; i < n; i++) buf[i] = 2 * ((freq * i / sr) % 1) - 1;
  } else if (type === 'square') {
    for (let i = 0; i < n; i++) buf[i] = Math.sin(2 * Math.PI * freq * i / sr) >= 0 ? 1 : -1;
  } else {
    const f0 = 20, f1 = 4000;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      buf[i] = Math.sin(2 * Math.PI * (f0 + (f1 - f0) * (t / seconds)) * t);
    }
  }
  return buf;
}

// ── FFT (Cooley-Tukey) ────────────────────────────────────────────────────────
function fftInPlace(re, im, N) {
  let j = 0;
  for (let i = 1; i < N; i++) {
    let bit = N >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
          t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= N; len <<= 1) {
    const half = len >> 1;
    const ang  = -2 * Math.PI / len;
    const wcos = Math.cos(ang), wsin = Math.sin(ang);
    for (let i = 0; i < N; i += len) {
      let wr = 1, wi = 0;
      for (let k = 0; k < half; k++) {
        const tr = wr*re[i+k+half] - wi*im[i+k+half];
        const ti = wr*im[i+k+half] + wi*re[i+k+half];
        re[i+k+half] = re[i+k] - tr; im[i+k+half] = im[i+k] - ti;
        re[i+k] += tr; im[i+k] += ti;
        const nwr = wr*wcos - wi*wsin; wi = wr*wsin + wi*wcos; wr = nwr;
      }
    }
  }
}

// ── Compute FFT ───────────────────────────────────────────────────────────────
function compute() {
  if (INTERACTIVE) {
    p.type = waveSel.value;
    p.freq = Math.max(20, parseFloat(freqNum.value) || 440);
  }
  ftData = null; playBuf = null; snappedFreq = null;
  playBtn.disabled = true;

  let genFreq = p.freq;
  if (activeExact && p.type !== 'sweep') {
    const k0 = Math.round(p.freq * N_FFT / SR);
    genFreq = k0 * SR / N_FFT;
    snappedFreq = genFreq;
  }

  const signal = generateSignal(p.type, N_FFT / SR, SR, genFreq);
  const re = new Float64Array(N_FFT);
  const im = new Float64Array(N_FFT);

  // Always Hann window
  for (let i = 0; i < N_FFT; i++)
    re[i] = signal[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N_FFT - 1)));

  fftInPlace(re, im, N_FFT);

  // Normalize re and im jointly so relative magnitudes are preserved
  let maxAbs = 0;
  for (let k = 0; k < N_FFT; k++) {
    const ar = Math.abs(re[k]), ai = Math.abs(im[k]);
    if (ar > maxAbs) maxAbs = ar;
    if (ai > maxAbs) maxAbs = ai;
  }
  const scale = maxAbs || 1;
  const reN = new Float32Array(N_FFT);
  const imN = new Float32Array(N_FFT);
  for (let k = 0; k < N_FFT; k++) {
    reN[k] = re[k] / scale;
    imN[k] = im[k] / scale;
  }

  ftData = { re: reN, im: imN };
  updatePlayBuf();
  renderFrequency();
  buildSettingsPanel();
  playBtn.disabled  = false;
  playBtn.className = 'btn-ok';
}

// Build fftshift-ordered audio buffer so playback sweeps −fNyq → +fNyq
function updatePlayBuf() {
  if (!ftData) return;
  const arr = activePart === 'real' ? ftData.re : ftData.im;
  let maxAbs = 0;
  for (let i = 0; i < N_FFT; i++) if (Math.abs(arr[i]) > maxAbs) maxAbs = Math.abs(arr[i]);
  playBuf = new Float32Array(N_FFT);
  if (maxAbs > 1e-12) {
    const gain = 0.85 / maxAbs;
    // fftshift: sample i plays bin (i + N_FFT/2) % N_FFT → sweeps neg to pos freq
    for (let i = 0; i < N_FFT; i++) playBuf[i] = arr[(i + N_FFT / 2) % N_FFT] * gain;
  }
}

// ── Shared plot margin helper ─────────────────────────────────────────────────
function getPlotRect(W, H, dpr) {
  const L = Math.round(46 * dpr), R = Math.round(8 * dpr);
  const T = Math.round(8  * dpr), B = Math.round(18 * dpr);
  return { L, R, T, B, PW: W - L - R, PH: H - T - B };
}

function clearCanvas() {
  const ctx = specCanvas.getContext('2d');
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, specCanvas.width, specCanvas.height);
}

// ── Frequency-domain render ───────────────────────────────────────────────────
// progress: undefined = static (Hz labels); 0..1 = playing (time labels + playhead)
function renderFrequency(progress) {
  if (!ftData) return;
  const arr    = activePart === 'real' ? ftData.re : ftData.im;
  const canvas = specCanvas;
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const dpr = window.devicePixelRatio || 1;
  const { L, T, B, PW, PH } = getPlotRect(W, H, dpr);
  const fNyq = SR / 2;
  const totalDur = N_FFT / SR;

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);
  if (PW <= 0 || PH <= 0) return;

  // amplitude → canvas y (centre = 0, top = +1, bottom = −1)
  function dy(a) { return T + PH * (1 - (a + 1) / 2); }
  const y0 = dy(0);
  const halfPW = PW / 2;

  // ── Grid lines ────────────────────────────────────────────────────────────
  ctx.lineWidth = 1;
  for (const [a, alpha] of [[-0.5, 0.07], [0.5, 0.07]]) {
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    const y = dy(a);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + PW, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';  // zero line
  ctx.beginPath(); ctx.moveTo(L, y0); ctx.lineTo(L + PW, y0); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.13)';  // DC vertical
  ctx.beginPath(); ctx.moveTo(L + halfPW, T); ctx.lineTo(L + halfPW, T + PH); ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  for (const f of [1000, 5000, 10000, 20000]) {
    for (const s of [-1, 1]) {
      const x = L + (s * f / fNyq + 1) * PW / 2;
      if (x > L && x < L + PW) {
        ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + PH); ctx.stroke();
      }
    }
  }

  // ── Per-pixel FFT values (linear, range max-abs, sign preserved) ──────────
  const pts = new Float32Array(PW);
  for (let px = 0; px < PW; px++) {
    let val = 0, maxAbsVal = 0;
    const b0 = Math.round((px       / PW - 0.5) * N_FFT);
    const b1 = Math.round(((px + 1) / PW - 0.5) * N_FFT);
    for (let b = b0; b <= b1; b++) {
      const k = ((b % N_FFT) + N_FFT) % N_FFT;
      const v = arr[k];
      if (Math.abs(v) > maxAbsVal) { maxAbsVal = Math.abs(v); val = v; }
    }
    pts[px] = val;
  }

  // ── Filled area split at zero line (glow-from-zero, symmetric) ──────────
  const fillPath = () => {
    ctx.moveTo(L, y0);
    for (let px = 0; px < PW; px++) ctx.lineTo(L + px, dy(pts[px]));
    ctx.lineTo(L + PW - 1, y0);
    ctx.closePath();
  };

  // Positive fill: bright at y0, transparent at top
  ctx.save();
  ctx.beginPath(); ctx.rect(L, T, PW, y0 - T); ctx.clip();
  ctx.beginPath(); fillPath();
  const gPos = ctx.createLinearGradient(0, y0, 0, T);
  gPos.addColorStop(0, 'rgba(200,144,42,0.55)');
  gPos.addColorStop(1, 'rgba(200,144,42,0.04)');
  ctx.fillStyle = gPos; ctx.fill();
  ctx.restore();

  // Negative fill: bright at y0, transparent at bottom
  ctx.save();
  ctx.beginPath(); ctx.rect(L, y0, PW, T + PH - y0); ctx.clip();
  ctx.beginPath(); fillPath();
  const gNeg = ctx.createLinearGradient(0, y0, 0, T + PH);
  gNeg.addColorStop(0, 'rgba(200,144,42,0.55)');
  gNeg.addColorStop(1, 'rgba(200,144,42,0.04)');
  ctx.fillStyle = gNeg; ctx.fill();
  ctx.restore();

  // ── Curve line ────────────────────────────────────────────────────────────
  const lineW = Math.max(1, Math.round(dpr));
  if (progress !== undefined) {
    // Played portion (bright)
    const playedPx = Math.round(progress * PW);
    if (playedPx > 0) {
      ctx.beginPath();
      for (let px = 0; px <= Math.min(playedPx, PW - 1); px++) {
        const x = L + px, y = dy(pts[px]);
        px === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(200,144,42,1.0)';
      ctx.lineWidth = lineW; ctx.stroke();
    }
    // Unplayed portion (dim)
    if (playedPx < PW) {
      ctx.beginPath();
      let started = false;
      for (let px = playedPx; px < PW; px++) {
        const x = L + px, y = dy(pts[px]);
        !started ? (ctx.moveTo(x, y), started = true) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(200,144,42,0.28)';
      ctx.lineWidth = lineW; ctx.stroke();
    }
    // Playhead
    const phX = L + progress * PW;
    ctx.strokeStyle = 'rgba(240,90,90,0.95)';
    ctx.lineWidth = Math.max(1.5, 1.5 * dpr);
    ctx.beginPath(); ctx.moveTo(phX, T); ctx.lineTo(phX, T + PH); ctx.stroke();
  } else {
    ctx.beginPath();
    for (let px = 0; px < PW; px++) {
      const x = L + px, y = dy(pts[px]);
      px === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(200,144,42,1.0)';
    ctx.lineWidth = lineW; ctx.stroke();
  }

  // ── Axis labels ───────────────────────────────────────────────────────────
  const fs = Math.max(7, Math.round(8.5 * dpr));
  ctx.font      = `${fs}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
  ctx.fillStyle = 'rgba(160,160,160,0.75)';

  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const [a, lbl] of [[1,'1'], [0,'0'], [-1,'−1']]) {
    ctx.fillText(lbl, L - 4*dpr, dy(a));
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  if (progress !== undefined) {
    // Time axis: each pixel x maps to time t = (x - L) / PW * totalDur
    const tStep = totalDur > 2 ? 0.5 : totalDur > 0.5 ? 0.1 : 0.01;
    for (let t = 0; t <= totalDur + tStep * 0.01; t += tStep) {
      const x = L + (t / totalDur) * PW;
      if (x >= L && x <= L + PW) ctx.fillText(t.toFixed(2) + 's', x, H - 2*dpr);
    }
  } else {
    // Frequency axis
    const fLabels = [[-20000,'-20k'],[-10000,'-10k'],[-5000,'-5k'],[-1000,'-1k'],
                     [0,'0'],[1000,'1k'],[5000,'5k'],[10000,'10k'],[20000,'20k']];
    for (const [f, lbl] of fLabels) {
      const x = L + (f / fNyq + 1) * PW / 2;
      if (x >= L && x <= L + PW) ctx.fillText(lbl, x, H - 2*dpr);
    }
  }
}

// ── Settings panel ────────────────────────────────────────────────────────────
function buildSettingsPanel() {
  const type      = p.type;
  const dispFreq  = snappedFreq !== null ? snappedFreq : p.freq;
  const freqLabel = Number.isInteger(dispFreq) ? dispFreq : dispFreq.toFixed(2);
  let srcLabel;
  if      (type === 'sine')     srcLabel = freqLabel + ' Hz Sine';
  else if (type === 'triangle') srcLabel = freqLabel + ' Hz Triangle';
  else if (type === 'sawtooth') srcLabel = freqLabel + ' Hz Sawtooth';
  else if (type === 'square')   srcLabel = freqLabel + ' Hz Square';
  else                          srcLabel = 'Sweep 20–4k Hz';

  const compLabel = activePart === 'real' ? 'Re[FT]' : 'Im[FT]';

  const items = [
    { key: 'Source',    val: srcLabel },
    { key: 'Window',    val: 'Hann' },
    { key: 'Bin snap',  val: activeExact ? 'On' : 'Off', accent: activeExact },
    { key: 'Component', val: compLabel, accent: true },
    { key: 'Method',    val: 'FT' },
  ];

  const panel = document.getElementById('settingsPanel');
  panel.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'settings-row';
  items.forEach((item, i) => {
    const el = document.createElement('span');
    el.className = 'st-item';
    el.innerHTML =
      '<span class="st-key">' + item.key + '</span>' +
      '<span class="st-val' + (item.accent ? ' accent' : '') + '">' + item.val + '</span>';
    row.appendChild(el);
    if (i < items.length - 1) {
      const sep = document.createElement('span');
      sep.className = 'st-sep'; sep.textContent = '·';
      row.appendChild(sep);
    }
  });
  panel.appendChild(row);
}
buildSettingsPanel();

// ── Initial computation ───────────────────────────────────────────────────────
compute();
</script>
