# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Behzad Haki
description: PhD Candidate · Music Technology Group · UPF · Barcelona
email: behzad.haki@upf.edu

lang: en
icon: 🥁️

url: https://behzadhaki.github.io
baseurl: ""

# -----------------------------------------------------------------------------
# Social integration (kept for backward compat with any social.html references)
# -----------------------------------------------------------------------------

github_username: behzadhaki
orcid_id: 0000-0002-8390-8190
research_gate_profile: Behzad-Haki
work_url: https://www.upf.edu/en/web/etic/entry/-/-/153171/adscripcion/behzad-haki

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    output: false

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

permalink: /:title

include:
  - _pages

exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
  - _posts_sample_markdowns
  - compile_additional_pages.py

keep_files:
  - CNAME
  - .nojekyll
  - .git

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll/scholar

paginate: 8
paginate_path: "/page/:num"

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------

defaults:
  - scope:
      path: "_pages"
    values:
      permalink: /:basename:output_ext
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Scholar (Publications)
# -----------------------------------------------------------------------------

scholar:

  last_name: [Haki]
  first_name: [Behzad, B.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview]

max_author_limit: 3
more_authors_animation_delay: 10

# -----------------------------------------------------------------------------
# SASS
# -----------------------------------------------------------------------------

sass:
  sass_dir: _sass
  style: compressed
